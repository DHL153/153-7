# Windows exe 자동 빌드
# - 자동 실행 안 함: Actions 탭 → Build Windows exe → Run workflow 로 원할 때만 실행
#   (또는 v1.0.0 같은 버전 태그를 올리면 실행)
# - 결과물: Actions 실행 화면 아래 "Artifacts" → LaMancha-windows (설치판 + 포터블)
name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 코드 서명 없이 빌드
      - uses: actions/upload-artifact@v4
        with:
          name: LaMancha-windows
          path: |
            dist/*.exe
          retention-days: 14
