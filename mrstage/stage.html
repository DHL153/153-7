   hitBurst(r,t);
   if(t>=3||(boss&&t>=2))shake(document.getElementById('battle-stage'),'s',shakeOn);
  }catch(e){}
 };
 // A3: finishing blow -> freeze beat, shards burst, punch zoom.
 MRFX.killFinish=function(enemyEl,level,shakeOn){
  if(window.__mrQuiet)return; // 처치 파편·확대 생략
  try{
   const st=document.getElementById('battle-stage'),r=visible(enemyEl||document.getElementById('enemy'));
   if(!r||!visible(st)||reduce())return;
   const t=tierOf(level),cx=r.left+r.width/2,cy=r.top+r.height/2;
   flash(st,'rgba(255,255,255,.35)');
   st.animate([{scale:'1'},{scale:'1.035'},{scale:'1'}],{duration:260,easing:'ease-out'});
   shake(st,t>=3?'l':'s',shakeOn);
   const n=8+t*3;
   for(let i=0;i<n;i++){
    const p=document.createElement('i');p.className='mrfx-shard';
    p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=i%3?TIER_COLOR[t]:'#fff';
    document.body.appendChild(p);
    const a=Math.PI*2*i/n+Math.random()*.4,d=30+Math.random()*(26+t*14);
    const dx=Math.cos(a)*d,dy=Math.sin(a)*d-12;
    p.animate([{transform:'translate(-50%,-50%) rotate(0) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${200+Math.random()*200}deg) scale(.9)`,opacity:1,offset:.6},{transform:`translate(calc(-50% + ${dx*1.15}px),calc(-50% + ${dy+26}px)) rotate(420deg) scale(.3)`,opacity:0}],{duration:520+Math.random()*180,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();
   }
  }catch(e){}
 };
 // A4: combo rush. Tuned for motion-sensitive players: modest speeds, no sudden jumps (ease up .3s / down .5s).
 //   chain 2-4: x1.2 | 5-9: x1.35 | 10+: x1.5 (background and hero legs share the rate)
 //   While the rush is on, attacks no longer freeze the background (CSS: [data-rush] keeps it running).
 const RUSH_TIERS=[{bg:1,hero:1},{bg:1.2,hero:1.2},{bg:1.35,hero:1.35},{bg:1.5,hero:1.5}]; // 2026-10-15: 발 박자와 땅 속도를 같은 배율로, 멀미 방지로 최대 1.5배
 let rushTimer=0,rushEndTimer=0;
 function panoramaAnimations(){
  const st=document.getElementById('battle-stage'),pano=document.getElementById('battle-panorama');if(!st||!st.getAnimations)return [];
  return st.getAnimations({subtree:true}).filter(a=>{const tg=a.effect?.target;return tg&&((pano&&(tg===pano||pano.contains(tg)))||(tg===st&&a.effect.pseudoElement));});
 }
 let rushRate=1,rushHero=1,rushRaf=0;
 function applyRushRate(rate,hero){
  rushRate=rate;rushHero=hero;window.__mrHeroRunRate=hero;
  panoramaAnimations().forEach(a=>{try{a.updatePlaybackRate(rate);}catch(e){a.playbackRate=rate;}});
  window.MRBattleSky?.rush(rate);
 }
 function easeRush(toBg,toHero,ms){
  cancelAnimationFrame(rushRaf);
  const fb=rushRate,fh=rushHero,t0=performance.now();
  if(Math.abs(fb-toBg)<.01&&Math.abs(fh-toHero)<.01){applyRushRate(toBg,toHero);return;}
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;applyRushRate(fb+(toBg-fb)*e,fh+(toHero-fh)*e);if(k<1)rushRaf=requestAnimationFrame(step);};
  rushRaf=requestAnimationFrame(step);
 }
 function rushTierOf(chain){return chain>=10?3:chain>=5?2:chain>=2?1:0;}
 function setRush(tier){
  const st=document.getElementById('battle-stage');if(!st)return;
  const t=RUSH_TIERS[tier]||RUSH_TIERS[0];
  clearTimeout(rushEndTimer);
  if(tier){
   easeRush(t.bg,t.hero,300);
   st.dataset.rush=String(tier);
   if(!st.querySelector('.mrfx-speed')){const sp=document.createElement('div');sp.className='mrfx-speed';sp.setAttribute('aria-hidden','true');st.appendChild(sp);}
  }else{
   easeRush(1,1,500);
   st.style.setProperty('--rush-o','0');
   rushEndTimer=setTimeout(()=>{delete st.dataset.rush;},520); // keep the background running until the ease-out ends
  }
 }
 // Speed lines from chain 3, gently stronger with longer chains (3 -> .12 ... capped .30). Half strength when screen shake is off.
 function rushLineOpacity(chain,shakeOn){
  if(chain<3)return 0;
  const o=Math.min(.30,.12+(chain-3)*.03);
  return shakeOn===false?o*.5:o;
 }
 MRFX.rush=function(chain,shakeOn){
  if(window.__mrQuiet)return;
  try{
   if(reduce())return;
   setRush(rushTierOf(chain));
   const st=document.getElementById('battle-stage');
   if(st){const o=rushLineOpacity(chain,shakeOn);st.style.setProperty('--rush-o',String(o));}
   clearTimeout(rushTimer);rushTimer=setTimeout(()=>setRush(0),window.MR_CHAIN_WINDOW_MS||2000);
  }catch(e){}
 };
 // B5: energy orb flies from the merge spot to the front hero (main view, both panels visible).
 let orbCount=0,lastOrb=0,orbBag={key:'',list:[],last:''};
 MRFX.mergeOrb=function(point,level){
  try{
   if(!point||reduce()||orbCount>=6)return;
   const now=performance.now();if(now-lastOrb<60)return;
   if(!visible(document.getElementById('merge-box'))||!visible(document.getElementById('battle-stage')))return;
   const heroes=[...document.querySelectorAll('#battle-stage .hero')].map(h=>[h,visible(h)]).filter(([h,r])=>r&&!h.hidden);
   if(!heroes.length)return;
   // Shuffled bag: every team member receives orbs in a random order, no long streaks on one hero.
   const ids=heroes.map(([h])=>h.id).sort().join('|');
   if(orbBag.key!==ids||!orbBag.list.length){
    const list=heroes.map(([h])=>h.id);
    for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
    if(list.length>1&&list[0]===orbBag.last)list.push(list.shift());
    orbBag={key:ids,list,last:orbBag.last};
   }
   const pickId=orbBag.list.shift();orbBag.last=pickId;
   let [hero,hr]=heroes.find(([h])=>h.id===pickId)||heroes[0];
   // 컷인 중: 원래 캐릭터는 숨겨져 있으므로 같은 슬롯의 컷인 캐릭터(없으면 보이는 컷인 아무나)로 모은다
   const st=document.getElementById('battle-stage'),cut=document.getElementById('skill-cinematic');
   if(st&&(st.dataset.teamSkill==='on'||cut?.classList.contains('on'))){
    const portraits=[...(cut?.querySelectorAll('.team-cut-in')||[])].map(p=>[p,tightRect(p)||visible(p)]).filter(([,r])=>r&&r.width);
    if(!portraits.length)return;
    const slot=hero.dataset.teamSlot;
    [hero,hr]=portraits.find(([p])=>p.dataset.teamSlot===slot)||portraits[Math.floor(Math.random()*portraits.length)];
   }
   lastOrb=now;orbCount++;
   const t=tierOf(level);
   const sx=point.left+(point.width||0)/2,sy=point.top+(point.height||0)/2,tx=hr.left+hr.width*.5,ty=hr.top+hr.height*.45;
   const mx=(sx+tx)/2+(Math.random()-.5)*60,my=Math.min(sy,ty)-40-Math.random()*30;
   const orb=document.createElement('i');orb.className='mrfx-orb';
   const size=8+t*4;Object.assign(orb.style,{left:'0px',top:'0px',width:size+'px',height:size+'px'});
   orb.style.setProperty('--orb',TIER_COLOR[t]);
   document.body.appendChild(orb);
   const pt=(x,y,sc,o)=>({transform:`translate(${x-size/2}px,${y-size/2}px) scale(${sc})`,opacity:o});
   // quadratic arc sampled into keyframes
   const frames=[];for(let i=0;i<=8;i++){const k=i/8,x=(1-k)*(1-k)*sx+2*(1-k)*k*mx+k*k*tx,y=(1-k)*(1-k)*sy+2*(1-k)*k*my+k*k*ty;frames.push(pt(x,y,i===0?.4:i===8?.6:1,i===0?0:1));}
   orb.animate(frames,{duration:380+t*40,easing:'cubic-bezier(.45,0,.6,1)'}).onfinish=()=>{
    orb.remove();orbCount=Math.max(0,orbCount-1);
    hero.animate([{filter:'brightness(1)'},{filter:'brightness(1.7) drop-shadow(0 0 6px '+TIER_COLOR[t]+')',offset:.3},{filter:'brightness(1)'}],{duration:260});
   };
  }catch(e){orbCount=Math.max(0,orbCount-1);}
 };

 // Chain pill sits in the empty space above the team's heads; never on top of the boss HUD.
 function tightRect(el){
  const box=el.getBoundingClientRect();if(!box.width||!box.height)return null;
  let b=null;
  try{b=window.__mrArtBounds?.(el.currentSrc||el.getAttribute('src'));}catch(_){}
  if(!b&&el.dataset.artBox){const v=el.dataset.artBox.split(',').map(Number);if(v.length===5&&v.every(Number.isFinite))b={x:v[0],y:v[1],w:v[2],h:v[3],aspect:v[4]};}
  if(!b||!(b.aspect>0))return box;
  let iw=box.width,ih=box.height;if(box.width/box.height>b.aspect)iw=box.height*b.aspect;else ih=box.width/b.aspect;
  const ix=box.left+(box.width-iw)/2,iy=box.top+(box.height-ih);
  return {left:ix+iw*b.x,top:iy+ih*b.y,right:ix+iw*(b.x+b.w),bottom:iy+ih*(b.y+b.h),width:iw*b.w,height:ih*b.h};
 }
 // Chain pill: identical in play and mini battle — bottom-right, just left of the pause slot.
 // Mini battle has no in-stage pause button, so it reuses the same slot geometry (last seen in play).
 let pauseSlot={right:8,bottom:8,w:32,h:32};
 MRFX.placeChain=function(el){
  try{
   const st=document.getElementById('battle-stage'),sr=visible(st);if(!el||!sr)return;
   el.classList.remove('compact');
   const gap=8;
   const pause=document.getElementById('battle-pause-btn');
   const pr=pause&&getComputedStyle(pause).display!=='none'?visible(pause):null;
   if(pr&&pr.bottom-sr.top>sr.height*.5)pauseSlot={right:sr.right-pr.right,bottom:sr.bottom-pr.bottom,w:pr.width,h:pr.height};
   const pw=el.offsetWidth||90,ph=el.offsetHeight||18;
   const slotLeft=sr.width-pauseSlot.right-pauseSlot.w,slotCy=sr.height-pauseSlot.bottom-pauseSlot.h/2;
   let cx=slotLeft-gap-pw/2,top=slotCy-ph/2;
   top=Math.min(sr.height-4-ph,Math.max(4,top));
   if(cx-pw/2<8)cx=8+pw/2;
   el.style.left=Math.round(cx)+'px';el.style.top=Math.round(top)+'px';
  }catch(e){}
 };

 // ---- chain pill hold during boss WARNING ----
 let warnUntil=0,warnTimer=0,heldChain=null,heldHideTimer=0;
 MRFX.holdChain=function(el){
  if(!el||performance.now()>=warnUntil)return false;
  heldChain={el,at:performance.now()};el.classList.remove('show','bump');return true;
 };
 function releaseChain(){
  const h=heldChain;heldChain=null;
  const win=window.MR_CHAIN_WINDOW_MS||2000,left=win-(performance.now()-(h?h.at:0));
  if(!h||left<=150)return; // chain window already over
  const el=h.el;
  MRFX.placeChain(el);
  el.style.setProperty('--cp-ms',Math.round(left)+'ms');el.style.setProperty('--cp-from',String(Math.max(0,Math.min(1,left/win))));
  const g=el.querySelector('.cp-gauge i');if(g){g.style.animation='none';void g.offsetWidth;g.style.animation='';}
  el.classList.remove('show','bump');void el.offsetWidth;el.classList.add('show','bump');
  clearTimeout(heldHideTimer);heldHideTimer=setTimeout(()=>el.classList.remove('show','bump'),left);
 }

 // ③ "×N HIT" above the enemy (combined hits)
 MRFX.hitCount=function(n){
  try{
   const st=document.getElementById('battle-stage'),sr=visible(st),en=document.getElementById('enemy');if(!sr||!en)return;
   const img=en.querySelector('img')||en,r=tightRect(img)||en.getBoundingClientRect();if(!r||!r.width)return;
   let el=st.querySelector('.mrfx-hits');if(!el){el=document.createElement('div');el.className='mrfx-hits';el.setAttribute('aria-hidden','true');st.appendChild(el);}
   el.innerHTML=`<b>×${n}</b> HIT`;
   el.style.left=Math.round(r.left+r.width/2-sr.left)+'px';el.style.top=Math.max(4,Math.round(r.top-sr.top-18))+'px';
   el.getAnimations().forEach(a=>a.cancel());
   el.animate([{opacity:0,transform:'translate(-50%,6px) scale(.8)'},{opacity:1,transform:'translate(-50%,0) scale(1.08)',offset:.2},{opacity:1,transform:'translate(-50%,-2px) scale(1)',offset:.7},{opacity:0,transform:'translate(-50%,-8px) scale(1)'}],{duration:reduce()?400:760,easing:'ease-out',fill:'forwards'});
  }catch(e){}
 };

 // ---- compact notices: one at a time, held during WARNING / cut-ins, none in mini mode ----
 const noticeQueue=[];let noticeBusy=false,noticeEl=null;
 const isMini=()=>!!document.getElementById('app')?.classList.contains('mini-merge-mode'); // mini battle shows notices like the main view
 function heldByScene(){
  const st=document.getElementById('battle-stage');
  return performance.now()<warnUntil||!!(st&&(st.dataset.teamSkill==='on'||document.getElementById('skill-cinematic')?.classList.contains('on')));
 }
 function noticeHost(){
  // Battle stage road band (bottom-left) when playing; otherwise under the top bar.
  const st=document.getElementById('battle-stage');
  if(visible(st))return {host:st,mode:'stage'};
  return {host:document.getElementById('app')||document.body,mode:'app'};
 }
 function pumpNotice(){
  if(noticeBusy||!noticeQueue.length)return;
  if(heldByScene()){setTimeout(pumpNotice,200);return;}
  const item=noticeQueue.shift();noticeBusy=true;
  const {host,mode}=noticeHost();
  if(!noticeEl){noticeEl=document.createElement('div');noticeEl.className='mrfx-notice';noticeEl.setAttribute('role','status');noticeEl.setAttribute('aria-live','polite');}
  if(noticeEl.parentElement!==host)host.appendChild(noticeEl);
  noticeEl.dataset.mode=mode;noticeEl.dataset.type=item.type||'info';
  if(mode==='app'){const tb=document.getElementById('top-bar');const tr=visible(tb),ar=host.getBoundingClientRect();noticeEl.style.top=(tr?Math.round(tr.bottom-ar.top+6):8)+'px';}else noticeEl.style.top='';
  noticeEl.innerHTML=(item.icon||'')+'<span></span>';noticeEl.querySelector('span').textContent=item.text||'';
  noticeEl.getAnimations().forEach(a=>a.cancel());
  const ms=Math.max(900,item.ms||1600),from=mode==='stage'?'translateX(-24px)':'translateX(24px)';
  const anim=noticeEl.animate([{opacity:0,transform:from},{opacity:1,transform:'translateX(0)',offset:.12},{opacity:1,transform:'translateX(0)',offset:.85},{opacity:0,transform:'translateX(0)'}],{duration:reduce()?ms*.8:ms,easing:'ease-out',fill:'forwards'});
  anim.onfinish=()=>{noticeBusy=false;setTimeout(pumpNotice,120);};
 }
 MRFX.notify=function(item){
  try{
   if(!item||isMini())return; // mini: fly + counter pulse only
   // Merge same-type notices waiting in the queue (keep the latest text).
   const i=noticeQueue.findIndex(q=>q.type===item.type);if(i>=0)noticeQueue.splice(i,1);
   noticeQueue.push(item);if(noticeQueue.length>3)noticeQueue.shift();
   pumpNotice();
  }catch(e){noticeBusy=false;}
 };
 // ---- "Lv.N ✦" tag at the new bead (main view only) ----
 MRFX.levelTag=function(point,level){
  try{
   if(!point||isMini()||reduce())return;
   const el=document.createElement('div');el.className='mrfx-lvtag';el.textContent=`Lv.${level} ✦`;
   el.style.left=(point.left+(point.width||0)/2)+'px';el.style.top=(point.top+(point.height||0)/2)+'px';
   document.body.appendChild(el);
   el.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.6)'},{opacity:1,transform:'translate(-50%,-90%) scale(1.1)',offset:.2},{opacity:1,transform:'translate(-50%,-130%) scale(1)',offset:.7},{opacity:0,transform:'translate(-50%,-160%) scale(1)'}],{duration:850,easing:'ease-out'}).onfinish=()=>el.remove();
  }catch(e){}
 };
 window.MRFX=MRFX;
})();
</script>
<script id="mr-battle-sky-js">
(()=>{
  const DIR='assets/art/backgrounds/sky/';
  // 세계별 먼 실루엣·풍차. hub = 풍차 몸통 그림에서 날개 축의 세로 위치(위에서부터 비율)
  const WORLDS={
    rust:{far:'far_rust.png',tower:'mill_rust_tower.png',blades:'mill_rust_blades.png',hub:.228},
    neon:{far:'far_neon.png',tower:'mill_neon_tower.png',blades:'mill_neon_blades.png',hub:.211},
    skyarc:{far:'far_skyarc.png',tower:'mill_skyarc_tower.png',blades:'mill_skyarc_blades.png',hub:.228}
  };
  const STAGES=5, GROUND_RATIO=2, FAR_RATIO=4, FAR_HEIGHT=.6;  // 실루엣 그림 2048x512 = 4:1, 전투 칸 높이의 60%
  const RUN_FRAME_MS=150, STRIDE=.075;                        // 2026-10-15: 멀미 줄이기 — 프레임 150ms, 땅 약 51px/s(직전 84px/s의 60%). 보폭 실측 .098보다 살짝 작게 잡아 땅을 더 느긋하게(발 미끄러짐은 거의 안 보이는 수준)
  window.MR_RUN_FRAME_MS=window.MR_RUN_FRAME_MS||RUN_FRAME_MS;
  const FAR_FOLLOW=.08, FAR_BOOST=.3;                         // 땅이 빨라진 만큼 먼 풍경 비율은 낮춤 (체감 속도 유지)
  const $=id=>document.getElementById(id);
  let cur=0, world='', timer=0, pending=null;

  function worldOf(src){
    const n=Number((String(src||'').match(/bg_battle_(\d{4})/)||[])[1])||1;
    return window.MRWorld?.keyOf?.(src)||(n<=10?'rust':n<=20?'neon':'skyarc'); // 2026-10-15: 배경 데이터의 world 우선
  }
  function setGround(src){
    const st=$('battle-stage'), w=worldOf(src); if(!st||w===world)return;
    world=w; const d=WORLDS[w];
    st.style.setProperty('--mr-far-img',`url('${DIR}${d.far}')`);
    st.style.setProperty('--mr-mill-tower',`url('${DIR}${d.tower}')`);
    st.style.setProperty('--mr-mill-blades',`url('${DIR}${d.blades}')`);
    st.style.setProperty('--mr-mill-hub',String(d.hub));
  }
  // 크기에 맞춰 타일 폭·속도 계산 (전투 칸 높이가 화면·미니 모드마다 다름)
  function layout(){
    const st=$('battle-stage'), pano=$('battle-panorama'), far=$('battle-sky-far'); if(!st||!pano||!far)return;
    const w=st.clientWidth, h=st.clientHeight; if(!w||!h)return; // 숨겨진 화면은 건너뜀
    const gw=Math.max(1,Math.round(h*GROUND_RATIO)), fw=Math.max(1,Math.round(h*FAR_HEIGHT*FAR_RATIO));
    // 2026-10-15: 땅 속도 = 캐릭터 보폭 ÷ 프레임 시간 → 발이 땅에서 미끄러지지 않음.
    // 달리기 그림(512px)에서 디딘 발이 한 프레임에 뒤로 가는 거리 ≈ 그림 높이의 9.8% (STRIDE)
    const hero=$('hero'), heroH=(hero&&hero.clientHeight)||Math.round(h*.76);
    const groundPx=STRIDE*heroH/((window.MR_RUN_FRAME_MS||RUN_FRAME_MS)/1000);
    st.style.setProperty('--mr-ground-w',gw+'px');
    st.style.setProperty('--mr-ground-dur',(2*gw/groundPx).toFixed(2)+'s');
    st.style.setProperty('--mr-far-w',fw+'px');
    st.style.setProperty('--mr-far-dur',(2*fw/(groundPx*FAR_FOLLOW)).toFixed(2)+'s');
    // 화면 너비 + 2칸만큼 그림이 있어야 끝이 안 보임 (먼 풍경은 풍차 주기를 맞추려고 짝수 칸)
    const imgs=pano.querySelectorAll('img'), need=Math.ceil(w/gw)+2, src=imgs[0]?.getAttribute('src')||'';
    for(let i=imgs.length;i<need;i++){const im=document.createElement('img');im.alt='';if(src)im.src=src;pano.appendChild(im);}
    let needFar=Math.ceil(w/fw)+2; needFar+=needFar%2;
    for(let i=far.children.length;i<needFar;i++){
      const t=document.createElement('div');t.className='far-tile';
      t.innerHTML='<div class="far-sil"></div><div class="far-mill"><i class="mill-tower"></i><i class="mill-blades"></i></div>';
      far.appendChild(t);
    }
  }
  function apply(n){
    const st=$('battle-stage'); if(!st)return;
    cur=((Math.floor(Number(n)||0)%STAGES)+STAGES)%STAGES;
    st.dataset.sky=String(cur);
  }
  window.MRBattleSky={
    // n = 이번 판에서 잡은 보스 수 → 하늘 0~4 순환. 처치 컷신이 시작된 뒤 바뀌도록 살짝 늦춤
    // 시안 C(window.mrSkyHold): 풍차 폭발(release) 때까지 기다림 — 혹시 폭발이 안 오면 4초 뒤 그냥 바꿈
    setStage(n,instant){clearTimeout(timer);pending=null;
      if(instant)apply(n);
      else if(window.mrSkyHold?.()){pending=n;timer=setTimeout(()=>{const p=pending;pending=null;if(p!=null)apply(p);},4000);}
      else timer=setTimeout(()=>apply(n),350);},
    release(){if(pending==null)return;const p=pending;pending=null;clearTimeout(timer);timer=setTimeout(()=>apply(p),350);},
    // 2026-10-16: 보스 처치 바람 — 풍차 포털의 큰 바람이 하늘을 왼쪽에서 오른쪽으로 쓸고 지나가며 다음 하늘로 넘김
    //  (하늘 바뀜 0.35초 뒤 시작 · 이 동안 하늘 전환을 1.8초 → 0.9초로 빠르게 해서 바람과 함께 바뀌게)
    windSweep(c){

  const BODY_PX=290/512;                  // 전투 그림 규칙(normalize_battle_chars.py): 512 그림에서 머리~발 290px
  const ATTACK_SPEED=1.5;  // 게임 공격 연출(100ms 뒤 타격)보다 리그 찌르기(0.8초)가 길어 1.5배속 → 약 0.53초, 타격 0.2초
  let enabled=null,canvas=null,ctx=null,raf=0,last=0,info=null,wasBusy=false;
  const rigs={};          // id → Promise<{rig,anim}> (같은 캐릭터 여러 명이면 def·images 공유)
  const live=new Map();   // slot → {id,footX,footY,scale,rig,anim}
  const $=id=>document.getElementById(id);

  // 2026-10-19 DHL '미리보기 애니메이션이 안 나오는 경우': 시작 선택·도감은 리그 10개를 한꺼번에 받느라(조각 그림 수십 MB) 휴대폰에서 한참 정지 그림으로 보였음
  //  → 목록 칸(urgent=false)은 줄 세워 하나씩, 전투·마이룸·크게 보기(누른 칸)는 바로. 바로 받을 게 생기면 줄에서 받던 것은 멈췄다가 나중에 다시
  const rigQueue=[];let rigQActive=null,rigUrgent=0;
  function fetchRig(id){
    const def=window.MR_RIG_DEFS?.[id],base=RIG_DIR+id+'/',ims=[];
    const promise=Promise.all(Object.entries(def.parts).map(([k,p])=>new Promise((res,rej)=>{const im=new Image();ims.push(im);im.onload=()=>res([k,im]);im.onerror=rej;im.src=/^data:/.test(p.src)?p.src:base+p.src+(def.version?'?v='+def.version:'');/*손패: 부위 그림을 rig.def.js 안에 묶음*/})))
      .then(pairs=>({def,images:Object.fromEntries(pairs)}));
    return {promise,abort(){for(const im of ims){im.onload=im.onerror=null;im.src='';}}};
  }
  function pumpRigQueue(){
    if(rigQActive||rigUrgent||!rigQueue.length)return;
    const j=rigQueue.shift();rigQActive=j;j.f=fetchRig(j.id);
    j.f.promise.then(v=>{if(rigQActive!==j)return;rigQActive=null;j.res(v);pumpRigQueue();},err=>{if(rigQActive!==j)return;rigQActive=null;j.rej(err);pumpRigQueue();});
  }
  function urgentLoad(id){
    if(rigQActive&&rigQActive.id!==id){const j=rigQActive;rigQActive=null;j.f.abort();rigQueue.unshift(j);} // 줄에서 받던 것 멈춤 → 맨 앞으로
    rigUrgent++;const f=fetchRig(id);f.promise.finally(()=>{rigUrgent--;pumpRigQueue();}).catch(()=>{});return f.promise;
  }
  function loadRig(id,urgent=true){
    const def=window.MR_RIG_DEFS?.[id];
    if(!def||!window.CharacterRig)return rigs[id]||(rigs[id]=Promise.reject(new Error('rig def missing: '+id)));
    if(rigs[id]){
      if(urgent){const qi=rigQueue.findIndex(q=>q.id===id);
        if(qi>=0){const j=rigQueue.splice(qi,1)[0];urgentLoad(id).then(j.res,j.rej);}
        else if(rigQActive&&rigQActive.id===id){/* 이미 받는 중 */}}
      return rigs[id];
    }
    if(urgent)return rigs[id]=urgentLoad(id);
    const job={id};rigs[id]=new Promise((res,rej)=>{job.res=res;job.rej=rej;});rigQueue.push(job);pumpRigQueue();return rigs[id];
  }
  function rigIdFor(slot,charId){ return enabled?REGISTRY[Number(charId)+1]||null:null; }
  function ensureCanvas(stage){
    if(canvas&&canvas.isConnected)return canvas;
    canvas=document.createElement('canvas');canvas.id='battle-rig-canvas';canvas.setAttribute('aria-hidden','true');
    stage.appendChild(canvas);ctx=canvas.getContext('2d');return canvas;
  }
  // layoutBattleTeam이 부른다: 발 위치(footX, 땅 선)와 몸 높이(머리~발, px)
  function layout(next){
    if(!next.W||!next.H)return; // 숨겨진 화면(0×0)의 배치값은 무시
    info=next;const stage=next.stage;if(!stage)return;
    const seen=new Set();
    next.members.forEach((m,i)=>{m.z=7-i;}); // 겹침 순서 = 그림 캐릭터의 --team-z (주 캐릭터가 맨 앞)
    for(const m of next.members){
      const id=rigIdFor(m.slot,m.id);
      if(!id){m.el?.classList.remove('mr-rig-hidden');continue;}
      seen.add(m.slot);
      const entry=live.get(m.slot)||{slot:m.slot};if(entry.id&&entry.id!==id){entry.rig=null;entry.anim=null;}entry.id=id;entry.el=m.el;entry.z=m.z;entry.footX=m.footX;entry.footY=next.H-next.ground;
      entry.bodyH=(m.imageH>0?m.imageH*BODY_PX:next.bodyH)*lmPortraitK(); // 그림 캐릭터와 같은 몸 크기 · (DHL 10-29) 휴대폰 세로는 70%
      // 배율은 배치할 때마다 다시 계산 (휴대폰처럼 처음 배치 뒤 전투 칸 크기가 바뀌면 옛 배율로 거대하게 그려졌음 — 2026-10-16 수정)
      if(entry.rig)entry.scale=entry.bodyH/(entry.rig.def.metrics?.bodyHeight||718);
      live.set(m.slot,entry);
      loadRig(id).then(({def,images})=>{
        if(live.get(m.slot)!==entry)return;
        if(!entry.rig||entry.rig.def!==def){entry.rig=new CharacterRig(def,images);entry.anim=new RunAnimator(entry.rig,{runSpeed:620});entry.anim.facing=1;}
        entry.scale=entry.bodyH/(def.metrics?.bodyHeight||718);
        m.el?.classList.add('mr-rig-hidden');
      }).catch(e=>{console.warn('[MRRig]',e);live.delete(m.slot);m.el?.classList.remove('mr-rig-hidden');});
    }
    for(const [slot,e] of live)if(!seen.has(slot)){e.el?.classList.remove('mr-rig-hidden');e.cv?.remove();live.delete(slot);}
    stage.classList.toggle('mr-rig-on',live.size>0);
    if(live.size){ensureCanvas(stage);start();}else stop();
  }
  // setBattleHeroState가 부른다: 공격(슬롯 지정)·스킬·승리·대기
  function onState(state,attackerSlot){
    for(const [slot,e] of live){
      if(!e.anim)continue;
      const atk=e.rig?.def?.ui?.attack||'thrust'; // 캐릭터별 공격 (니콜 찌르기, 알론소 내려찍기)
      const AO=e.rig?.def?.ui?.attackOpts||{}; // ui.attackOpts(opt-in, 2026-10-21 4 로시): 공격 옵션 — {hold:초} = 그만큼 연사(누르고 있는 것처럼)
      if(state==='attack'&&slot===attackerSlot)e.anim.attack(atk,{...AO,speed:ATTACK_SPEED});
      else if(state==='skill'){e.anim.attack(atk,{...AO,speed:ATTACK_SPEED*.8});e.anim.setExpression('shout');}
      else if(state==='victory')e.anim.setExpression('happy');
      else if(state==='idle')e.anim.setExpression(null);
    }
  }
  // 땅 속도(px/s) = 타일 2칸 ÷ 한 바퀴 시간 (mr-battle-sky-js의 layout과 같은 식)
  function groundPx(stage){
    const cs=getComputedStyle(stage),gw=parseFloat(cs.getPropertyValue('--mr-ground-w'))||290,dur=parseFloat(cs.getPropertyValue('--mr-ground-dur'))||24;
    return (2*gw/dur)*(window.__mrHeroRunRate||1);
  }
  function tick(now){
    raf=requestAnimationFrame(tick);
    const stage=info?.stage;if(!stage||!canvas)return;
    let dt=Math.min(.05,(now-last)/1000);last=now;

<script id="mrstage-api">// ===== 라만차 손패 ↔ M&R 전투 무대 연결층 =====

(()=>{

    const L=[...new Set(all)];const guests=L.filter(n=>n!==heroNum);
    const heroStrikes=!L.length||L.includes(heroNum)||!!o.killed;
    const IMP={dmg:o.dmg,final:true,mult:o.mult,hp:o.hp,killed:!!o.killed,heavy:true};
    // (DHL 10-28) 적 체력은 공격할 때마다 나눠서 깎임 — 피해 숫자(카운트)는 마지막 일격에 그대로
    const hp0=hp,hpT=o.hp!=null?o.hp:hp0,K=guests.length+(heroStrikes?1:0),hpAt=i=>Math.max(hpT,Math.round(hp0-(hp0-hpT)*(i+1)/Math.max(1,K)));
    await Promise.all(guests.map(loadRigDef));
    let heroOut=false;const outs=[];
    if(guests.length){
      const occ=[hero,null,null];
      show([1,2],false);setMul([1,2],null);offsetTeam(-W*.9,[1,2]);
      const out=(async()=>{setMul([0],0);await walk(actors[0].off,-W*.9,650,'in',[0]);setMul([0],null);show([0],false);})();
      occ[1]=guests[0]-1;if(guests[1]!=null)occ[2]=guests[1]-1;applyTeam(occ.slice());
      await Promise.all([out,waitRig([1,2],3000)]);heroOut=true;
      const bySlot={1:null,2:null};
      for(let i=0;i<guests.length;i++){
        const sl=1+(i%2);
        if(i>=2){await bySlot[sl];occ[sl]=guests[i]-1;show([sl],false);applyTeam(occ.slice());offsetTeam(-W*.9,[sl]);await waitRig([sl],3000);}   // 3번째 동료부터: 앞사람이 빠진 자리에 새로 들어옴
        const carry=!heroStrikes&&i===guests.length-1;
        const res=await perform(sl,guests[i],{enter:true,level:carry?11:8,impact:carry?IMP:{hp:hpAt(i)}});
        if(carry)await sleep(260);
        const lv=leave(sl,res);bySlot[sl]=lv;outs.push(lv);
      }
    }
    cast.finish=false;
    if(heroStrikes){
      if(heroOut)await waitRig([0],2000);
      const res=await perform(0,heroNum,{enter:heroOut,level:11,impact:IMP});
      await sleep(o.killed?520:260);
      if(o.killed&&!o.demo){
        const en=$('enemy');
        try{if(en){window.MRFX?.killFinish(en,11,true);en.className='character enemy explode'+(kind==='boss'?' boss-enemy':'');}}catch(e){}
        cast.finish=true;origVictory.call(window,'boss');
        await sleep(80);await waitIdle(4000);cast.finish=false;
        await exit();
      }else{
        if(o.killed&&o.demo){cast.finish=true;origVictory.call(window,'boss');await sleep(80);await waitIdle(4000);cast.finish=false;}
        await goHome(0,res);
      }
    }else{
      // 주인공은 치지 않고 다시 걸어 들어와 제자리
      await Promise.all(outs);
      applyTeam([hero,null,null]);await waitRig([0],2000);show([0],true);await dash(-W*.9,0,560,'out',[0],2.4);clearOffset([0]);actors[0].oy=0;actors[0].rot=0;
    }
    await Promise.all(outs);if(guests.length&&!(o.killed&&!o.demo))applyTeam([hero,null,null]);   // 동료 자리 비움 (다음 카드 빛 구슬이 숨은 동료에게 가지 않게)
  }
  // 미리보기(게임 상태를 바꾸지 않음): 처치해도 퇴장·보상 없이 제자리로
  let demoPh='';   // (DHL 10-29 '연출 앞뒤 다른 캐릭터 잔상') 바깥 화면이 무대를 보여줄 때만 알 수 있게: live = 연출 캐릭터 준비됨 · end = 연출 끝(원래 캐릭터로 되돌리기 전)
  async function demo(o){
    demoPh='prep';const before=[...activeBattleTeam];
    // (DHL 10-29 '전투 연출 보기가 안 됨') 적을 쓰러뜨린 뒤(밤 · 적 치워짐)에 열면 빈 무대에서 허공을 침 → 연출 동안만 적 · 낮 하늘을 되살렸다가 끝나면 원래대로
    const cleared=stage.classList.contains('lm-cleared'),sky0=skyN,en0=$('enemy');
    if(cleared){stage.classList.remove('lm-cleared','lm-still','lm-foe-dead');if(en0)en0.className='character enemy'+(kind==='boss'?' boss-enemy':'');skyN=1;window.MRBattleSky?.setStage(1,true);}
    if(o.hero){const h=o.hero;await loadRigDef(h);show(ALL,false);applyTeam([h-1,null,null]);await waitRig([0],4000);offsetTeam(0);show([0],true);}
    if(o.stars)stars={...stars,...o.stars};
    const keep={hp,maxHp};demoPh='live';
    try{await finale({final:true,nums:o.nums||[],stars:o.stars,dmg:o.dmg||1234,mult:o.mult||3,hp:null,killed:!!o.killed,demo:true});}finally{demoPh='end';}
    await new Promise(r=>setTimeout(r,280));   // 바깥 화면이 무대를 감출 시간
    hp=keep.hp;maxHp=keep.maxHp;setHud();stage.classList.remove('lm-foe-dead');
    const en=$('enemy');if(en&&/explode/.test(en.className))en.className='character enemy'+(kind==='boss'?' boss-enemy':'');
    if(o.hero||before.some((v,i)=>v!==activeBattleTeam[i])){show(ALL,false);applyTeam(before);await waitRig(ALL,4000);clearOffset();for(const sl of ALL){actors[sl].oy=0;actors[sl].rot=0;}show(ALL.filter(i=>before[i]!=null),true);}
    if(cleared){show(ALL,false);stage.classList.add('lm-still','lm-cleared');skyN=sky0;window.MRBattleSky?.setStage(sky0,true);}
  }


  // ── ★10 연출 감독(Director) — 근본 수정 (2026-10-28)
  //    예전: 원본 배치(layoutBattleTeam) · 리그 배치(MRRig.layout) · 걷기 · 숨기기가 각자 위치(footX)와 visibility를 고쳐 써서
  //          다시 배치될 때마다 위치가 제자리로 튀거나, 리그 준비 전 정지 그림 · 이전 캐릭터 그림이 잠깐 보였음
  //    지금: 캐릭터 자리마다 '배우' 상태 하나 {off: 제자리에서 밀린 px, vis: 보이기, mul: 달리기 배율}만 고친다.
  //          · 리그 위치 footX = (원본이 정한 제자리) + off  ← 속성 자체를 이렇게 정의해서, 누가 다시 배치해도 off가 사라지지 않음
  //          · 보이기는 매 프레임 이 상태에서만 정함 (기본 = 안 보임). 리그는 그림이 다 준비돼야 보이고, 리그 캐릭터의 정지 그림(img)은 절대 안 보임
  //          · 라운드 시작은 round() 한 번에: 숨김 → 팀·적·땅 바꾸기 → 리그 준비 → 보이며 걸어 들어옴 (중간 상태가 화면에 안 나옴)
  const ROUND_SKY=[1,2,4];let roundTk=0;   // 하늘: 0 새벽 · 1 낮 · 2 노을 · 3 밤 · 4 포털 — 졸개 낮 · 기사 노을 · 거인 포털
  const ALL=[0,1,2];
  const actors=ALL.map(()=>({off:0,vis:false,mul:null,oy:0,rot:0}));window.__lmActors=actors;   // ★14 oy·rot = 뛰어오르기·떨어지기·기울기
  const isRigSlot=sl=>{const id=activeBattleTeam[sl];return id!=null&&!!window.MRRig?.enabled&&!!window.MRRig?.registry?.[id+1];};
  const rigReady=sl=>{const e=window.MRRig?.live?.get?.(sl);return !!(e&&e.rig&&e.anim);};
  function bindLive(){
    for(const [sl,e] of (window.MRRig?.live||new Map())){
      if(e.__lmBound)continue;e.__lmBound=true;
      let home=e.footX;
      Object.defineProperty(e,'footX',{configurable:true,enumerable:true,get(){return home+(actors[sl]?.off||0);},set(v){home=v;}});
      Object.defineProperty(e,'__runMul',{configurable:true,get(){const m=actors[sl]?.mul;return m==null?undefined:m;},set(){}});
    }
  }
  if(window.MRRig?.layout){const ol=MRRig.layout;MRRig.layout=function(){const r=ol.apply(this,arguments);bindLive();return r;};}
  (function frame(){
    requestAnimationFrame(frame);
    for(const c of stage.querySelectorAll(':scope>.mr-rig-still,#battle-rig-canvas'))c.style.setProperty('opacity','0','important');   // 무대 위 정지 리그·공용 캔버스는 쓰지 않음 (잔상 방지)
    for(const sl of ALL){
      const a=actors[sl],el=battleTeamElement(sl),rig=isRigSlot(sl),e=window.MRRig?.live?.get?.(sl);
      if(el){el.style.translate=(a.off||a.oy)?a.off.toFixed(1)+'px '+(-(a.oy||0)).toFixed(1)+'px':'';el.style.rotate=a.rot?a.rot+'deg':'';el.style.setProperty('opacity',(a.vis&&!rig&&activeBattleTeam[sl]!=null)?'1':'0','important');}
      if(e&&e.cv){const on=a.vis&&rig&&rigReady(sl);e.cv.style.setProperty('opacity',on?'1':'0','important');e.cv.style.translate=a.oy?'0 '+(-a.oy).toFixed(1)+'px':'';if(a.rot){e.cv.style.transformOrigin=(e.footX||0).toFixed(0)+'px '+(e.footY||0).toFixed(0)+'px';e.cv.style.rotate=a.rot+'deg';}else e.cv.style.rotate='';
        if(!on&&e.cx&&!e.__lmClear){e.cx.setTransform(1,0,0,1,0,0);e.cx.clearRect(0,0,e.cv.width,e.cv.height);e.__lmClear=true;}else if(on)e.__lmClear=false;}   // 숨길 때 그림을 지워 다시 보일 때 이전 그림(잔상)이 한 프레임도 안 남게
    }
  })();
  let curOff=0;
  function offsetTeam(dx,slots=ALL){for(const sl of slots)actors[sl].off=dx;if(slots===ALL)curOff=dx;}
  function clearOffset(slots=ALL){offsetTeam(0,slots);}
  const show=(slots,v)=>{for(const sl of slots)actors[sl].vis=!!v;};
  const setMul=(slots,m)=>{for(const sl of slots)actors[sl].mul=m;};
  function walk(from,to,ms,ease,slots=ALL){
    return new Promise(res=>{const t0=performance.now();
      const f=now=>{const k=Math.min(1,(now-t0)/ms),e=ease==='in'?k*k:1-Math.pow(1-k,2);offsetTeam(from+(to-from)*e,slots);if(k<1)requestAnimationFrame(f);else res();};
      requestAnimationFrame(f);});
  }
  async function dash(from,to,ms,ease,slots,m){setMul(slots,m);await walk(from,to,ms,ease,slots);setMul(slots,null);}
  async function waitRig(slots,max=6000){
    const t0=performance.now(),ok=()=>slots.every(sl=>!isRigSlot(sl)||rigReady(sl));
    while(!ok()&&performance.now()-t0<max)await sleep(50);
    await sleep(80);
  }
  function setupEnemy(o){
    stage.classList.remove('lm-foe-dead');
    kind=o.kind==='boss'?'boss':'normal';enemyName=o.name||'';hp=maxHp=Math.max(1,o.maxHp||1);if(o.hp!=null)hp=o.hp;
    clearBattleVisualQueue(true);
    const enemy=$('enemy');
    if(kind==='boss'){
      bossActive=true;bossVisualLock=true;bossLevel=Math.max(1,o.level||1);MR.pickBossArt();MR.setEnemy('boss');
      enemy.className='character enemy slide-in boss-enemy';
      if(o.warning!==false&&window.MRFX)window.MRFX.bossWarning(bossLevel,!!gameSettings.screenShake);
    }else{
      bossActive=false;bossVisualLock=false;
      curEnemyId=o.art||1+Math.floor(Math.random()*FLYING_ENEMY_ART.length);
      MR.setEnemy(curEnemyId);enemy.className='character enemy slide-in';
    }
    setHud();sizeEnemy();
  }
  // 라운드 시작 (한 번에): 밤 · 모두 숨김 → 땅 · 적 · 팀 → 리그 준비 → 하늘 밝아지며 왼쪽에서 걸어 들어옴
  async function round(o){
    const W=stage.clientWidth||400;
    show(ALL,false);setMul(ALL,null);offsetTeam(-W*.75);resetCharge();
    stage.classList.remove('lm-cleared','lm-foe-dead');stage.classList.add('lm-still');
    window.MRBattleSky?.setStage(3,true);skyN=3;
    if(o.ground)setBattleStageBackground(backgroundPath('battle',Math.max(1,Math.min(30,o.ground|0))));
    const nums=(o.team||[]).filter(n=>n>=1&&n<=30).slice(0,3);
    await Promise.all(nums.map(loadRigDef));nums.forEach(warm);
    applyTeam([0,1,2].map(i=>nums[i]!=null?nums[i]-1:null));
    if(o.enemy)setupEnemy(o.enemy);
    await waitRig(ALL);
    show(ALL,true);
    skyN=ROUND_SKY[o.rd|0]??1;window.MRBattleSky?.setStage(skyN,false);
    await walk(-W*.75,0,1500,'out');
    stage.classList.remove('lm-still');   // 자리에 서면 땅이 흐르기 시작(달리기)
  }
  // 런 시작: 이번 런 카드의 동료(최대 2명). 자리를 내주는 동료는 멈춰 땅과 함께 뒤로 빠지고 → 새 동료가 빠른 달리기로 들어옴
  async function joinRun(nums){
    nums=[...new Set((nums||[]).filter(n=>n>=1&&n<=30))].filter(n=>n-1!==activeBattleTeam[0]).slice(0,2);
    if(!nums.length)return;
    await Promise.all(nums.map(loadRigDef));
    const t=[...activeBattleTeam],slots=[];
    nums.forEach(n=>{if(t.includes(n-1))return;const sl=[1,2].find(i=>!slots.includes(i)&&!nums.includes((t[i]??-2)+1))??[1,2].find(i=>!slots.includes(i));if(sl==null)return;t[sl]=n-1;slots.push(sl);});
    if(!slots.length)return;
    const W=stage.clientWidth||400,leaving=slots.filter(sl=>activeBattleTeam[sl]!=null);
    if(leaving.length){setMul(leaving,0);await walk(0,-W*.8,750,'in',leaving);}
    show(slots,false);setMul(slots,null);offsetTeam(-W*.8,slots);
    applyTeam(t);
    await waitRig(slots,4000);
    show(slots,true);setMul(slots,1.8);
    await walk(-W*.8,0,600,'out',slots);setMul(slots,null);clearOffset(slots);
  }
  async function exit(){
    const W=stage.clientWidth||400;resetCharge();
    const C={rust:['#ffc58a','#e07a3f'],neon:['#7ff6ff','#ff3fa4'],skyarc:['#ffd27a','#58b8ff']}[world]||['#ffe9a8','#ffc96a'];
    try{window.MRBattleSky?.windSweep?.(C);}catch(e){}
    if(skyN!==2){skyN=2;window.MRBattleSky?.setStage(2,false);}
    stage.classList.add('lm-still');   // 땅은 멈추고 팀이 화면 밖으로 달려 나감
    const base=ALL.map(sl=>actors[sl].off);
    const w=new Promise(res=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/1600),e=k*k;for(const sl of ALL)actors[sl].off=base[sl]+(W*1.1-base[sl])*e;if(k<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});
    await sleep(900);skyN=3;window.MRBattleSky?.setStage(3,false);
    await w;show(ALL,false);
    stage.classList.add('lm-cleared');window.parent?.postMessage?.({mrStage:'cleared'},'*');await sleep(500);
  }

  const api={
    // 팀: M&R 캐릭터 번호(1~30). 0번 자리 = 이번 라운드 주인공
    async setTeam(nums){
      await ready;
      nums=(nums||[]).filter(n=>n>=1&&n<=30).slice(0,3);
      await Promise.all(nums.map(loadRigDef));
      const team=[0,1,2].map(i=>nums[i]!=null?nums[i]-1:null);baseTeam=team;nums.forEach(warm);
      return seq(async()=>{if(team.some((id,i)=>id!==activeBattleTeam[i])){show(ALL,false);applyTeam(team);await waitRig(ALL);}show(ALL,true);});
    },
    preload(nums){(nums||[]).forEach(n=>{loadRigDef(n);warm(n);});},
    // 땅: 세계(rust·neon·skyarc) 안에서 번호(1~10)
    async setGround(w,n){
      await ready;
      world={rust:'rust',neon:'neon',skyarc:'skyarc',sky:'skyarc'}[w]||'rust';
      const base={rust:0,neon:10,skyarc:20}[world];
      setBattleStageBackground(backgroundPath('battle',base+((Math.max(1,n|0)-1)%10)+1));
    },
    round(o){const tk=++roundTk;return ready.then(()=>seq(()=>tk===roundTk?round(o||{}):null));},   // 연달아 오면 마지막 라운드만
    setGroundNum(n){return ready.then(()=>setBattleStageBackground(backgroundPath('battle',Math.max(1,Math.min(30,n|0)))));},
    setSky(n,instant){skyN=n|0;window.MRBattleSky?.setStage(skyN%5,instant!==false);},
    // 적: kind 'normal'(망령 8종) | 'boss'(보스 4종, WARNING 등장)
    async setEnemy(o={}){await ready;return seq(async()=>setupEnemy(o));},
    setCap(o){capO=o||null;drawCap();},   // (DHL 10-29) 관통: {cap:한 번 최대 피해, dmg:예상 피해(견습만), brk:3개 맞춤} · null = 숨김
    setHp(cur,max){if(finPend>0){finHp=[cur,max];if(max)maxHp=max;return;}hp=cur;if(max)maxHp=max;setHud();},   // (DHL 10-28) 마지막 일격 연출 중엔 체력을 한 번에 깎지 않음 — 공격마다 깎이고, 끝난 뒤 맞춤
    // 타격 한 번: num = 카드 캐릭터(무대에 없으면 동료로 나왔다 들어감), skill = 컷인, level = 세기(0~11), dmg·crit = 피해 숫자, combo = 연타 수
    //   final = 합동 일격(팀 전원, 총 피해·배수), killed = 쓰러짐(슬로모션 → 처치 컷신 → 하늘)
    joinRun(){return Promise.resolve();},   // ★11 동료는 마지막에 치고 빠지기만
    hit(o={}){if(o.final){finPend++;return seq(async()=>{try{await finale(o);}finally{finPend--;gsBroken=false;gsBlock=null;try{drawGems();}catch(e){}if(finPend<=0&&finHp){hp=finHp[0];if(finHp[1])maxHp=finHp[1];finHp=null;setHud();}}});}quick(o);return Promise.resolve();},
    demo(o={}){return ready.then(()=>seq(()=>demo(o)));},
    demoPhase(){return demoPh;},   // ★14 전투 연출 미리보기 (게임 상태는 그대로)
    routes(){return {ROUTE,ROUTE_KO};},
    busy(){return pending>0||!idle()||!!document.querySelector('.mrfc');},
    queued(){return pending;},
    pause(on){globalPause=!!on;},
    clear(){clearBattleVisualQueue(true);}
  };

  ready=(async()=>{
    await loadGameAssetData();
    trimRunFrames();
    activeBattleTeam=[null,null,null];
    setBattleStageBackground(backgroundPath('battle',1));
  })();
  api.ready=ready;
  window.MRStage=api;
  window.parent?.postMessage?.({mrStage:'ready'},'*');
})();
</script>
<style id="lm-routes-css">
/* ★14 공격 동선 효과 (stage-api.js routes) — 크기는 원본 전투 칸(145px) 기준, 무대와 같이 확대됨 */

.lmfx.lm-ring{width:var(--s,60px);height:calc(var(--s,60px)*.32);border-radius:50%;border:3px solid var(--c1);box-shadow:0 0 10px var(--c2),inset 0 0 8px var(--c2);translate:-50% -50%;animation:lmRing .5s cubic-bezier(.2,.9,.3,1) forwards}
.lmfx.lm-ring.big{width:calc(var(--s,60px)*1.6);border-width:4px;animation-duration:.65s}
@keyframes lmRing{0%{scale:.15;opacity:1}100%{scale:1.4;opacity:0}}
.lmfx.lm-dust{width:calc(var(--s,60px)*1.2);height:calc(var(--s,60px)*.35);translate:-50% -80%;background:radial-gradient(closest-side,#e9d7b5cc,#c8a77a66 55%,transparent);border-radius:50%;animation:lmDust .8s ease-out forwards}
