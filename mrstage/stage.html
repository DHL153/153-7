<!doctype html>
<html lang="ko" class="mr-uikit ui-t6 ui-t1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merge &amp; Run La Mancha — 전투 무대</title>
<link rel="stylesheet" href="assets/ui/art-edition.css"/>
<style>
        * { box-sizing: border-box; font-family: 'Pretendard', 'Segoe UI', sans-serif; }
        
        body { 
            margin: 0; padding: 0; background: #2b2b2b; 
            display: flex; justify-content: center; align-items: center; 
            height: 100dvh; width: 100vw; overflow: hidden;
            color: #d5dde7; user-select: none; touch-action: none;
        }

        #app {
            width: 100%; max-width: 520px; height: 100dvh; 
            background: rgba(253, 251, 247, 1); position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5); overflow: hidden;
        }

        @media (min-width: 421px) {
            #app { width:var(--desktop-width, 520px); max-width:var(--desktop-width, 520px); height:var(--desktop-height, 900px); border-radius:12px; border:4px solid #d2bce3; }
        }

        @keyframes mergeShake { 0% { transform: translate(1px, 1px) rotate(0deg); } 50% { transform: translate(-1px, -1px) rotate(-1deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        .merge-shake { animation: mergeShake 0.15s ease-in-out; }
        
        @keyframes whiteFlash { 0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; filter: brightness(2); background: rgba(255,255,255,1); } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; background: rgba(255,255,255,0); } }
        @keyframes ringExpand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; border: 4px solid rgba(255,255,255,0.9); } 100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; border: 1px solid rgba(255,255,255,0); } }

        /* ================= [ 💡 상단 바 (타이머 복구) ] ================= */
        #top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #fff; border-bottom: 2px solid #e8dff5; flex-shrink: 0; z-index: 20; }
        .stat-badge { background: #fdfbf7; padding: 6px 12px; border-radius: 12px; font-size: 14px; font-weight: 900; border: 2px solid #e8dff5; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .stat-badge.gold { color: #f3a35c; border-color: #ffeaa7; background: #fffdf2; } 
        .stat-badge.timer { color: #27ae60; border-color: #a8e6cf; background: #f0fff4; min-width: 80px;}
        .stat-badge.merge { color: #c9b8f2; }
        .top-stats { display: flex; gap: 8px; align-items: center; justify-content: flex-end;}

        /* ================= [ SPA 뷰 컨테이너 구조 ] ================= */
        #main-content { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; background: #fdfbf7; }
        .view-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; overflow: hidden; }
        .view-container.active { display: flex; }

        /* ================= [ 💡 뷰 1: 상점 (통합 뽑기 & 합성소) ] ================= */
        #view-shop { background: #fff; overflow-y: auto; }
        .shop-banner { background: linear-gradient(135deg, #a29bfe, #6c5ce7); padding: 30px 20px; text-align: center; color: white; border-bottom: 4px solid #574b90; }
        .shop-banner h1 { margin: 0 0 10px 0; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .shop-rates { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-around; font-weight: bold; }
        .shop-rates span.c { color: #dcdde1; } .shop-rates span.b { color: #74b9ff; } .shop-rates span.a { color: #a29bfe; } .shop-rates span.s { color: #fab1a0; } .shop-rates span.ss { color: #ffeaa7; text-shadow: 0 0 5px #fdcb6e;}
        
        .gacha-btn-container { display: flex; flex-direction: column; gap: 15px; padding: 25px 20px; align-items: center;}
        .btn-gacha { width: 100%; max-width: 320px; background: #fff; border: 3px solid #ffeaa7; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.1s; box-shadow: 0 6px 0 #fdcb6e; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;}
        .btn-gacha:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
        .btn-gacha:disabled { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }
        .btn-gacha .title { font-size: 22px; font-weight: 900; color: #f3a35c; }
        .btn-gacha .cost-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;}
        .btn-gacha .cost { font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 8px; display:flex; align-items:center; gap:4px; background: #fdfbf7; border: 1px solid #e8dff5;}
        .btn-gacha.daily-free { border-color:#55efc4; box-shadow:0 6px 0 #00b894; position:relative; }
        .btn-gacha.daily-free .title { color:#6fe0c1; }
        .free-badge { position:absolute; top:-10px; right:-8px; background:#ff4757; color:#fff; border:2px solid #fff; border-radius:999px; padding:4px 9px; font-size:10px; font-weight:1000; box-shadow:0 3px 8px rgba(0,0,0,.18); animation:pulse .65s infinite alternate; }
        .economy-balance { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; margin-bottom:10px; border-radius:11px; background:#fff8e8; border:1px solid #ffe3a3; color:#6d4c19; font-weight:900; font-size:12px; }
        .economy-balance strong { font-size:18px; color:#e67e22; }
        .economy-tabs { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:8px 0 10px; }
        .economy-tabs::-webkit-scrollbar { display:none; }
        .economy-tab { flex:0 0 auto; border:1px solid #ddcfed; background:#fff; color:#c9b8f2; border-radius:999px; padding:6px 10px; font-size:10px; font-weight:900; cursor:pointer; }
        .economy-tab.active { background:#6a4c9c; color:#fff; border-color:#6a4c9c; }
        .economy-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; max-height:270px; overflow:auto; padding:3px; }
        .economy-item { min-width:0; min-height:64px; border:1px solid #eadff5; border-radius:10px; background:#fff; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; cursor:pointer; overflow:hidden; }
        .economy-item:hover { border-color:#a98bd0; }
        .economy-item .small-count { font-size:9px; font-weight:1000; color:#c9b8f2; }
        .economy-item .power-risk { position:absolute; left:3px; bottom:3px; font-size:8px; background:#fff0f0; color:#ff7f86; border-radius:5px; padding:1px 3px; font-weight:900; }
        .compact-collection-grid{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:7px!important;max-height:300px;overflow:auto;padding:3px;align-content:start}.compact-collection-grid .tier-separator{grid-column:1/-1}.compact-collection-grid .inv-item{min-height:64px}.craft-filter-row{display:flex;gap:6px;overflow-x:auto;padding:0 1px 9px}.craft-filter-btn{flex:0 0 auto;border:1px solid #ddcfed;background:#fff;color:#c9b8f2;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;cursor:pointer}.craft-filter-btn.active{background:#3498db;color:#fff;border-color:#3498db}
        .economy-item .new-power { position:absolute; left:3px; bottom:3px; font-size:8px; background:#eafff7; color:#6fe0c1; border-radius:5px; padding:1px 3px; font-weight:900; }
        .shop-help-note { font-size:10px; line-height:1.45; color:#75638e; background:#faf7ff; border:1px solid #eadff5; border-radius:10px; padding:9px; margin-top:9px; }
        .collection-power-card { margin-bottom:12px; padding:12px; border-radius:14px; background:linear-gradient(135deg,#6c5ce7,#8e7dff); color:#fff; box-shadow:0 6px 18px rgba(108,92,231,.20); }
        .collection-power-card .power-main { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
        .collection-power-card .power-label { font-size:10px; font-weight:900; opacity:.85; letter-spacing:.5px; }
        .collection-power-card .power-value { font-size:25px; font-weight:1000; }
        .collection-power-card .power-sub { margin-top:7px; font-size:10px; line-height:1.45; opacity:.95; }
        .power-tier-row { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:9px; }
        .power-tier-cell { background:rgba(255,255,255,.13); border-radius:7px; padding:5px 2px; text-align:center; font-size:8px; font-weight:900; }
        .power-change-preview { margin:8px 0; border-radius:10px; padding:9px; background:#fff7f7; border:1px solid #ffc9c9; color:#b33939; font-size:11px; line-height:1.5; font-weight:800; }

        /* 통합 합성소 패널 */
        .panel { background: #fff; border: 2px solid #e8dff5; border-radius: 16px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .panel-title { font-size: 16px; font-weight: 900; color: #c9b8f2; border-bottom: 2px dashed #e8dff5; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .action-btn-main { width: 100%; background: #b9f6ca; border: 2px solid #69f0ae; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 900; color: #1b5e20; cursor: pointer; box-shadow: 0 4px 0 #69f0ae; transition: all 0.1s; margin-bottom: 15px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .action-btn-main:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .action-btn-sub { flex: 1; background: #fdfbf7; border: 2px solid #e8dff5; border-radius: 8px; padding: 10px; font-weight: bold; color: #c9b8f2; cursor: pointer; box-shadow: 0 4px 0 #e8dff5; transition: all 0.1s; }
        .action-btn-sub:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* ================= [ 뷰 2: 전투 & 머지 화면 ] ================= */
        /* 2026-09-02 Layout balance:
           Battle 160→128px(-20%), freed vertical space is returned to the Merge play area.
           Merge physics/canvas aspect ratio stays unchanged to preserve collision/render quality. */

        /* 전투 배경은 머지 보드와 한 장면처럼 이어지도록 가장자리까지 채웁니다. */
        #board-section { flex-shrink: 0; height: 148px; background: #2c2c2c; position: relative; border-bottom: 0; display: flex; justify-content: center; align-items: stretch; padding: 0; z-index: 10; overflow:hidden; }
        #battle-stage { width: 100%; height: 100%; background-color:#2c2c2c; border:0; border-radius:0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; padding:0 40px; isolation:isolate; }
        #battle-stage::before { display:none; content:none; }
        #battle-stage::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.10)); }
        #battle-stage.battle-action-pause::before { animation:none !important; }
        
        .hero { height:99px; width:auto; object-fit:contain; transition:transform .15s ease-out,filter .15s ease-out; transform-origin:center bottom; filter:drop-shadow(0 4px 4px rgba(0,0,0,.5)); z-index:5; position:relative; top:25px; animation:heroIdleBob 1.8s ease-in-out infinite; }
        .hero.attack { transform:translateX(34px) scale(1.08); animation:none; }
        .hero.skill { transform:translateX(24px) scale(1.12); filter:drop-shadow(0 0 10px rgba(116,185,255,.85)) drop-shadow(0 4px 4px rgba(0,0,0,.5)); animation:none; }
        .hero.victory { transform:translateY(-4px) scale(1.08); filter:drop-shadow(0 0 10px rgba(255,234,167,.8)) drop-shadow(0 4px 4px rgba(0,0,0,.5)); animation:none; }
        @keyframes heroIdleBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
        .character.enemy { font-size: 58px; line-height: 1; transition: all 0.2s ease-out; opacity: 0; transform: translateX(50px); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); position:relative; top:18px; }
        .character.enemy.slide-in { transform: translateX(0); opacity: 1; }
        .character.enemy.explode { animation: explodeAnim 0.4s forwards ease-out; }
        
        .hit-effect-sprite { position: absolute; right: 35px; top: 50%; transform: translateY(-50%) scale(0.5); font-size: 50px; opacity: 0; pointer-events: none; z-index: 10; animation: hitFlash 0.3s ease-out forwards; }
        
        #game-section { flex: 1; position: relative; overflow: hidden; touch-action: none; background-color: #8a5a35; display: flex; flex-direction: column; align-items: center; padding-top: 0;}
        
        /* 💡 물리엔진 캔버스가 완벽하게 작동하도록 크기를 명시적으로 고정 */
        #merge-box {
            width:100%;
            max-width:520px;
            aspect-ratio:1 / 1;
            height:auto;
            max-height:none;
            position:relative;
            border-radius:0;
            overflow:hidden;
            touch-action:none;
            margin-bottom:0;
            flex-shrink:0;
            background:#8a5a35;
        }
        #physics-bg {
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            background:url('assets/art/backgrounds/merge/bg_merge_0001.png') center center / 100% 100% no-repeat;
            z-index:0;
            pointer-events:none;
            transform:translateZ(0);
        }

        /*
          2026-09-02 rollback:
          머지 배경 표시를 이전 버전 감성으로 되돌리고, 앞으로는 1300x1300 정사각형 리소스를 기준으로 사용합니다.
          Matter.js 월드(360x330)는 유지하여 플레이 밸런스는 바꾸지 않습니다.
        */
        #physics-area {
            position:absolute;
            top:9%;
            left:2%;
            width:96%;
            height:auto;
            aspect-ratio:360 / 330;
            z-index:5;
            pointer-events:none;
        }
        #physics-area canvas { width:100% !important; height:100% !important; display:block; }
        #touch-catcher {
            position:absolute;
            top:9%;
            left:2%;
            width:96%;
            height:auto;
            aspect-ratio:360 / 330;
            z-index:25;
            cursor:crosshair;
            touch-action:none;
        }

        #preview-ball { position: absolute; top: 20px; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; display: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #drop-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; border-left: 2px dashed #b9a0e6; pointer-events: none; display: none; z-index: 5; transform: translateX(-50%); }
        #deadline-line { position: absolute; top: 95px; left: 15px; width: 360px; height: 2px; border-bottom: 2px dashed #ff70a6; z-index: 4; pointer-events: none; }
        #warning-banner { position: absolute; top: 105px; left: 50%; transform: translate(-50%, -50%); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 2px solid white; display: none; z-index: 30; animation: pulse 0.5s infinite alternate; background: #ff477e; box-shadow: 0 4px 10px rgba(255, 71, 126, 0.4); pointer-events: none; white-space:nowrap;}

        #ui-section{width:100%;max-width:520px;background:linear-gradient(180deg,#fcf9ff 0%,#f5effb 100%);padding:9px 10px 10px;display:flex;flex-direction:column;border-top:2px solid #d7c7ec;z-index:10;border-radius:12px 12px 0 0;flex-shrink:0;box-shadow:0 -4px 12px rgba(78,57,111,.06);}
        .item-group{
            display:grid;
            grid-template-columns:repeat(5,minmax(0,1fr));
            align-items:stretch;
            gap:6px;
        }
        .btn-item{
            min-width:0;
            height:78px;
            padding:7px 3px 6px;
            border:1px solid rgba(103,82,140,.20);
            border-radius:11px;
            font-size:10px;
            font-weight:900;
            color:#52466a;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            transition:transform .1s ease, box-shadow .1s ease, filter .1s ease;
            box-shadow:0 3px 0 rgba(79,63,105,.18),0 5px 12px rgba(75,55,105,.07);
        }
        .btn-item:active{
            transform:translateY(3px);
            box-shadow:0 0 0 transparent!important;
        }
        .btn-item span.icon-main{
            min-height:21px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:17px;
            line-height:1;
            margin:0 0 3px;
        }
        .btn-item .control-name{
            min-height:12px;
            font-size:9px;
            line-height:1;
            font-weight:1000;
            color:#51436a;
        }
        .cost-label{
            min-height:13px;
            margin-top:4px;
            font-size:8px;
            line-height:1;
            font-weight:1000;
            color:#9b6a32;
            white-space:nowrap;
        }
        .btn-mult{
            background:linear-gradient(180deg,#eee8fb 0%,#dfd3f6 100%);
            border-color:#cbb8ea;
        }
        .btn-auto{
            flex:1;
            margin:0;
            transform:none;
            background:linear-gradient(180deg,#eef4ff 0%,#dce9fa 100%);
            border-color:#bfd3eb;
        }
        .btn-auto.active{
            transform:none;
            background:linear-gradient(180deg,#dff8ef 0%,#c4eddc 100%);
            border-color:#78cbaa;
            color:#287a60;
            box-shadow:0 3px 0 #6dbb9d,0 5px 12px rgba(55,130,102,.10);
        }
        .btn-auto.active .control-name,
        .btn-auto.active .cost-label{color:#287a60}
        .btn-organize{
            background:linear-gradient(180deg,#e4f7fb 0%,#c9edf4 100%);
            border-color:#9fd7e1;
        }
        .btn-shake{
            background:linear-gradient(180deg,#fff7d9 0%,#f8e9ad 100%);
            border-color:#e9cf72;
        }
        .btn-tornado{
            background:linear-gradient(180deg,#ecfae3 0%,#d7f0c6 100%);
            border-color:#a9d789;
        }

        #battle-pause-btn {
            position:absolute; top:8px; right:8px; z-index:30;
            width:34px; height:30px; border-radius:9px; border:2px solid rgba(255,255,255,.88);
            background:rgba(31,34,45,.78); color:#fff; font-size:14px; font-weight:1000;
            cursor:pointer; backdrop-filter:blur(5px); box-shadow:0 3px 8px rgba(0,0,0,.18);
        }
        #battle-pause-btn.paused { background:#6c5ce7; }
        #battle-pause-overlay {
            display:none; position:absolute; inset:0; z-index:120;
            align-items:center; justify-content:center; flex-direction:column; gap:10px;
            background:rgba(28,24,38,.73); backdrop-filter:blur(4px); color:#fff; text-align:center;
        }
        #battle-pause-overlay.show { display:flex; }
        #battle-pause-overlay .pause-title { font-size:23px; font-weight:1000; }
        #battle-pause-overlay .pause-sub { font-size:10px; opacity:.88; line-height:1.45; }
        #battle-pause-overlay button { border:2px solid #fff; background:#1dd1a1; color:#fff; border-radius:12px; padding:9px 18px; font-weight:1000; cursor:pointer; }
        .btn-item .cost-label.cost-rising { color:#ff7f86 !important; font-weight:1000; }

        /* ================= [ 제네릭 뷰 스타일 & 패널 ] ================= */
        .view-title { background: #cda8e6; color: white; text-align: center; padding: 15px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(185, 160, 230, 0.4); flex-shrink: 0; z-index:10; }
        .view-content { padding: 20px; flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 40px;}

        /* 인벤토리 티어 시스템 공통 */
        .inventory-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        
        .tier-separator { grid-column: 1 / -1; font-size: 14px; font-weight: 900; color: #fff; padding: 6px 10px; margin-top: 15px; margin-bottom: 5px; border-radius: 8px; text-align: center; letter-spacing: 1px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tier-separator:first-child { margin-top: 0; }
        .sep-L { background: linear-gradient(90deg, #fbc02d, #ffeb3b, #fbc02d); color: #8e6800;}
        .sep-E  { background: linear-gradient(90deg, #f57c00, #ffb74d, #f57c00); }
        .sep-R  { background: linear-gradient(90deg, #8e24aa, #ba68c8, #8e24aa); }
        .sep-U  { background: linear-gradient(90deg, #0288d1, #4fc3f7, #0288d1); }
        .sep-C  { background: linear-gradient(90deg, #757575, #bdbdbd, #757575); }

        .inv-item { border-radius: 12px; padding: 8px 5px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: transform 0.1s; border: 2px solid #e8dff5; background: #fdfbf7;}
        .inv-item:active:not(.unowned) { transform: scale(0.95); }
        .inv-item.unowned { filter: grayscale(1); opacity: 0.4; cursor: not-allowed; }
        .inv-item.selected { outline: 3px solid #d81b60; box-shadow: 0 0 10px rgba(216,27,96,0.35); }
        .empty-state { grid-column: 1 / -1; padding: 24px 10px; text-align:center; color:#8d9fb2; font-size:13px; font-weight:700; }
        
        .tier-box-L { background: linear-gradient(135deg, #fff9c4, #ffeb3b); border-color: #fbc02d; }
        .tier-box-E  { background: linear-gradient(135deg, #ffe0b2, #ffb74d); border-color: #f57c00; }
        .tier-box-R  { background: linear-gradient(135deg, #e1bee7, #ba68c8); border-color: #8e24aa; }
        .tier-box-U  { background: linear-gradient(135deg, #b3e5fc, #4fc3f7); border-color: #0288d1; }
        .tier-box-C  { background: linear-gradient(135deg, #f5f5f5, #e0e0e0); border-color: #9e9e9e; }
        
        .inv-item .emoji { font-size: 26px; margin-bottom: 2px; }
        .inv-item .skin-img-icon { width: 35px; height: 35px; object-fit: contain; margin-bottom: 2px; }
        .inv-item .count { position: absolute; top: -5px; right: -5px; background: #ff477e; color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; z-index: 2;}
        .tier-label { font-size: 9px; font-weight: 900; padding: 2px 4px; border-radius: 6px; color: #fff; margin-bottom:2px; background: rgba(0,0,0,0.4); }

        /* ================= [ 💡 뷰 3: 캐릭터 꾸미기 뷰 (우측 패널 완벽 반영) ] ================= */
        #view-character { flex-direction: column; height: 100%; background: #fff; overflow: hidden;}
        .char-custom-layout { display: flex; flex-direction: row; height: 100%; width: 100%; }
        
        #char-preview-zone {
            flex:1; min-width:0; position:relative; background:#e8dff5;
            overflow:hidden; display:flex; justify-content:center; align-items:center;
            --char-x:50%; --char-y:54%;
            --char-preview-bg-image:none;
            --bg-focus-x:50%;
            --bg-focus-y:50%;
            --char-user-scale:1; --char-user-rotate:0deg; --char-user-flip:1; --bg-user-scale:1;
        }

        /* 카테고리 열림:
           배경 선택/확인이 목적이므로 원본 전체를 볼 수 있게 contain.
           남는 영역은 동일 배경의 blur-cover로 자연스럽게 채운다. */
        #char-preview-bg {
            position:absolute; inset:0; width:100%; height:100%;
            object-fit:contain;
            object-position:var(--bg-focus-x) var(--bg-focus-y);
            z-index:1;
            transition:opacity .22s ease, object-position .25s ease;
            filter:none; background:transparent; user-select:none; -webkit-user-drag:none;
        }
        #char-preview-zone::before {
            content:""; position:absolute; inset:-18px; z-index:0;
            background-image:var(--char-preview-bg-image, none);
            background-size:cover;
            background-position:var(--bg-focus-x) var(--bg-focus-y);
            background-repeat:no-repeat;
            filter:blur(14px) brightness(.78) saturate(.92);
            transform:scale(1.08);
            opacity:.52; pointer-events:none;
            transition:opacity .25s ease;
        }
        #char-preview-zone::after {
            content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
            box-shadow:inset 0 0 28px rgba(0,0,0,.05);
        }

        /* 카테고리 닫힘 = 감상/몰입 모드.
           배경을 무조건 화면에 꽉 채우고 JSON focusX/focusY를 크롭 기준점으로 사용한다. */
        /* 2026-10-13 방 상자 맞춤 (B+A): 열림·닫힘 모두 배경 원본 비율 그대로(contain).
           캐릭터·이모지 층은 스크립트(mr-room-stage)가 배경 그림이 실제로 그려진 영역에 맞춰 함께 줄어듦.
           남는 위·아래(또는 좌·우)는 같은 배경을 흐리고 어둡게 깔아 마감. */
        /* 2026-10-13 수정: 흐린 띠는 카테고리 열림(배경 고르기)에서만. 기본(닫힘)은 빈틈 없이 꽉 채움(cover)
           — 위·아래가 잘릴 때는 바닥이 남도록 아래쪽 기준(--bg-cover-y, 기본 70%) */
        .char-custom-layout.char-panel-closed #char-preview-bg {
            object-fit:cover;
            object-position:var(--bg-focus-x) var(--bg-cover-y,70%);
        }
        #char-preview-zone::before {
            opacity:1; filter:blur(16px) brightness(.55) saturate(.85);
        }
        .char-custom-layout.char-panel-closed #char-preview-zone::before { opacity:0; }
        #char-character-layer { position:absolute; inset:0; z-index:3; pointer-events:none; } /* 2026-10-12: 배경 → 이모지·방꾸미기 → 캐릭터 순 */
        .char-preview-character {
            position:absolute; left:50%; top:50%; bottom:auto;
            width:58%; height:68%; object-fit:contain; object-position:center center;
            transform:translate(-50%,-50%); z-index:2; padding:0;
            transition:left .28s ease, top .28s ease, width .28s ease, height .28s ease, transform .18s ease, filter .16s ease;
            touch-action:none; user-select:none; -webkit-user-drag:none; pointer-events:auto;
        }
        /* 2026-10-12: 캐릭터 앞뒤 순서 = 배치 목록 순서 (인라인 z-index, 뒤 2 → 앞 4). 선택해도 순서는 그대로 */
        .char-custom-layout.char-panel-closed .char-preview-character {
            width:44%; height:58%; cursor:pointer;
        }
        .char-custom-layout.char-panel-closed .char-preview-character.selected-character { cursor:grab; }
        .char-custom-layout.char-panel-closed .char-preview-character.dragging {
            cursor:grabbing; transition:none;
        }
        .char-custom-layout.char-editing .char-preview-character:not(.selected-character) {
            filter:brightness(.88) saturate(.88);
        }
        .char-custom-layout.char-editing .char-preview-character.selected-character {
            filter:drop-shadow(0 0 8px rgba(255,71,126,.52));
        }
        .char-preview-character.pet-bounce { animation:charPetBounce .46s ease; }
        .char-preview-character.scene-snap {
            transition:none !important;
        }
        /* 2026-10-12 마이룸 감상 모드 걷기: 위치·그림은 매 프레임 스크립트(roomWalker)가 정하므로 전환 효과·튀는 애니메이션 끔 */
        .char-custom-layout.room-walking .char-preview-character { transition:filter .16s ease !important; animation:none !important; cursor:pointer !important; }
        .room-speech {
            position:absolute; z-index:11; pointer-events:none;
            min-width:38px; height:36px; width:max-content;
            display:flex; align-items:center; justify-content:center;
            padding:0 9px; border-radius:18px;
            background:rgba(255,255,255,.96); border:1.5px solid var(--rs-c,#ff9fc0);
            box-shadow:0 6px 16px rgba(20,16,40,.22);
            color:#2f2540; font-size:13px; font-weight:800; line-height:1.38;
            transform:translate(-50%,-100%); transform-origin:var(--rs-tail,50%) 100%;
            animation:roomSpeechIn .22s cubic-bezier(.2,.9,.3,1.2) both;
        }
        .room-speech::after {
            content:""; position:absolute; top:100%; left:var(--rs-tail,50%);
            width:10px; height:10px; margin:-5px 0 0 -6px;
            background:inherit; border-right:1.5px solid var(--rs-c,#ff9fc0); border-bottom:1.5px solid var(--rs-c,#ff9fc0);
            transform:rotate(45deg);
        }
        .room-speech-sym { font-size:21px; line-height:1; font-weight:900; font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif; }
        .room-speech-ico { width:24px; height:24px; display:block; object-fit:contain; }
        .room-speech.out { animation:roomSpeechOut .2s ease forwards; }
        @keyframes roomSpeechIn { from { opacity:0; transform:translate(-50%,-92%) scale(.7); } to { opacity:1; transform:translate(-50%,-100%) scale(1); } }
        @keyframes roomSpeechOut { to { opacity:0; transform:translate(-50%,-110%) scale(.94); } }
        @media (prefers-reduced-motion:reduce) { .room-speech, .room-speech.out { animation:none; } }
        .char-placement-count { color:#ff477e !important; min-width:auto !important; font-weight:1000 !important; }
        .char-item-btn.placed-character { box-shadow:inset 0 0 0 2px rgba(29,209,161,.65); }
        .placed-character-badge { position:absolute; left:4px; bottom:4px; z-index:7; background:#1dd1a1; color:#fff; border-radius:6px; padding:2px 4px; font-size:7px; font-weight:1000; }
        .char-item-btn.selected .placed-character-badge { background:#ff477e; }
        @keyframes charPetBounce {
            0%,100% { transform:translate(-50%,-50%) scale(1); }
            40% { transform:translate(-50%,-53%) scale(1.035); }
            70% { transform:translate(-50%,-49%) scale(.995); }
        }
        .char-love-heart {
            position:absolute; z-index:8; pointer-events:none;
            transform:translate(-50%,-50%) scale(.7);
            animation:charHeartFloat .95s ease-out forwards;
            font-size:16px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
        }
        @keyframes charHeartFloat {
            0% { opacity:0; transform:translate(-50%,-35%) scale(.55) rotate(-8deg); }
            18% { opacity:1; }
            100% { opacity:0; transform:translate(calc(-50% + var(--heart-x)), calc(-50% - 62px)) scale(1.2) rotate(var(--heart-r)); }
        }

        /* 캐릭터 교감 반응: 짧고 가볍게, 꾸미기 UI와 충돌하지 않게 구성 */
        .char-custom-layout.char-panel-closed .char-preview-character.love-react {
            animation:charLoveReact .72s cubic-bezier(.22,.85,.32,1);
        }
        @keyframes charLoveReact {
            0%,100% {
                transform:translate(-50%,-50%) scale(var(--char-user-scale,1))
                    rotate(var(--char-user-rotate,0deg)) scaleX(var(--char-user-flip,1));
            }
            22% {
                transform:translate(-50%,-54%) scale(calc(var(--char-user-scale,1) * 1.045))
                    rotate(calc(var(--char-user-rotate,0deg) - 3deg)) scaleX(var(--char-user-flip,1));
            }
            48% {
                transform:translate(-50%,-50%) scale(calc(var(--char-user-scale,1) * .985))
                    rotate(calc(var(--char-user-rotate,0deg) + 3deg)) scaleX(var(--char-user-flip,1));
            }
            72% {
                transform:translate(-50%,-52%) scale(calc(var(--char-user-scale,1) * 1.018))
                    rotate(calc(var(--char-user-rotate,0deg) - 1deg)) scaleX(var(--char-user-flip,1));
            }
        }
        .char-love-spark {
            position:absolute; z-index:9; pointer-events:none;
            left:var(--sx); top:var(--sy);
            font-size:var(--ss,13px);
            transform:translate(-50%,-50%) scale(.25) rotate(var(--sr,0deg));
            animation:charSparkPop .8s ease-out forwards;
            filter:drop-shadow(0 1px 2px rgba(0,0,0,.12));
        }
        @keyframes charSparkPop {
            0% { opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(var(--sr,0deg)); }
            22% { opacity:1; transform:translate(-50%,-50%) scale(1.18) rotate(var(--sr,0deg)); }
            65% { opacity:1; }
            100% { opacity:0; transform:translate(-50%,calc(-50% - 24px)) scale(.75) rotate(calc(var(--sr,0deg) + 24deg)); }
        }
        .char-love-bubble {
            position:absolute; z-index:10; pointer-events:none;
            padding:5px 8px; border-radius:999px;
            background:rgba(255,255,255,.92);
            border:1px solid rgba(255,168,196,.72);
            box-shadow:0 4px 12px rgba(76,42,72,.14);
            color:#ff477e; font-size:13px; font-weight:900;
            transform:translate(-50%,-50%) scale(.7);
            animation:charLoveBubble .92s cubic-bezier(.2,.8,.25,1) forwards;
        }
        @keyframes charLoveBubble {
            0% { opacity:0; transform:translate(-50%,-30%) scale(.55); }
            18% { opacity:1; transform:translate(-50%,-52%) scale(1.05); }
            72% { opacity:1; transform:translate(-50%,-62%) scale(1); }
            100% { opacity:0; transform:translate(-50%,-82%) scale(.92); }
        }
        .char-love-aura {
            position:absolute; z-index:3; pointer-events:none;
            width:88px; height:88px; border-radius:50%;
            border:2px solid rgba(255,112,160,.42);
            box-shadow:0 0 20px rgba(255,112,160,.22), inset 0 0 18px rgba(255,255,255,.28);
            transform:translate(-50%,-50%) scale(.35);
            animation:charLoveAura .68s ease-out forwards;
        }
        @keyframes charLoveAura {
            0% { opacity:0; transform:translate(-50%,-50%) scale(.35); }
            20% { opacity:.9; }
            100% { opacity:0; transform:translate(-50%,-50%) scale(1.55); }
        }
        
        /* ================= 캐릭터 감상/꾸미기 모드 ================= */
        #char-emoji-layer { position:absolute; inset:0; z-index:2; pointer-events:none; } /* 배경 바로 위 */
        .placed-emoji {
            position:absolute;
            left:var(--emoji-x); top:var(--emoji-y);
            transform:translate(-50%,-50%) scale(var(--emoji-scale,1)) rotate(var(--emoji-rotate,0deg)) scaleX(var(--emoji-flip,1));
            font-size:clamp(24px,7vw,42px); line-height:1;
            user-select:none; touch-action:none;
            filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));
            transform-origin:center center;
        }
        .char-custom-layout.char-editing .placed-emoji {
            pointer-events:auto; cursor:grab;
            outline:1px dashed rgba(255,255,255,.42);
            outline-offset:3px; border-radius:10px; padding:3px;
        }
        .char-custom-layout.char-editing .placed-emoji.selected {
            outline:2px dashed #ff6b9a;
            outline-offset:4px;
            filter:drop-shadow(0 2px 3px rgba(0,0,0,.18)) drop-shadow(0 0 6px rgba(255,107,154,.55));
        }

            cursor:grabbing; outline:2px solid rgba(255,255,255,.95);
        }
        #char-customize-btn { display:none; position:absolute; right:14px; bottom:16px; z-index:12; border:1px solid rgba(255,255,255,.72); border-radius:999px; background:rgba(34,25,48,.58); color:#fff; backdrop-filter:blur(8px); padding:8px 13px; font-size:12px; font-weight:900; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.18); }

        #char-customize-topbar button { border:0; border-radius:9px; padding:6px 10px; font-size:11px; font-weight:900; background:rgba(255,255,255,.18); color:#fff; }

/* ============================================================
   Skill Cutscene: 1.35s cinematic hit
   - GIF 재생은 유지
   - 배경만 회색/어둡게
   - skill 이미지 확대 + 임팩트 흔들림
   ============================================================ */
#battle-stage.skill-cutscene{
    animation:skillStageShake 1.35s cubic-bezier(.22,.61,.36,1) both;
}
#battle-stage.skill-cutscene::before{
    /* ::before 자체가 현재 PNG 스크롤 배경이므로 이 레이어를 직접 회색/암전 처리 */
    filter:grayscale(1) brightness(.34) contrast(1.22) !important;
    opacity:.96 !important;
    z-index:-2 !important;
    transition:filter .10s ease, opacity .10s ease !important;
}
#battle-stage.skill-cutscene::after{
    /* 캐릭터 앞이 아닌 배경 위에 시네마틱 암전/광원 레이어를 추가 */
    content:"" !important;
    position:absolute !important;
    inset:0 !important;
    z-index:4 !important;
    pointer-events:none !important;
    background:
      radial-gradient(circle at 36% 50%,
        rgba(255,255,255,.22) 0%,
        rgba(220,225,235,.10) 18%,
        rgba(20,22,28,.34) 52%,
        rgba(0,0,0,.72) 100%),
      linear-gradient(115deg,
        transparent 0 32%,
        rgba(255,255,255,.18) 34%,
        transparent 38% 100%) !important;
    animation:skillScreenPulse 1.35s ease-out both !important;
}
#battle-stage.skill-cutscene .hero.skill{
    z-index:7 !important;
    animation:skillHeroCutscene 1.35s cubic-bezier(.18,.78,.23,1) both !important;
    filter:
      drop-shadow(0 0 7px rgba(255,255,255,.95))
      drop-shadow(0 0 16px rgba(116,185,255,.95))
      drop-shadow(0 5px 5px rgba(0,0,0,.6)) !important;
}
#battle-stage.skill-cutscene .character.enemy{
    filter:grayscale(.85) brightness(.72) drop-shadow(0 4px 4px rgba(0,0,0,.5)) !important;
}
@keyframes skillHeroCutscene{
    0%   { transform:translateX(20px) scale(1.05); opacity:.55; }
    12%  { transform:translateX(31px) scale(1.38) rotate(-1deg); opacity:1; }
    26%  { transform:translateX(36px) scale(1.46) rotate(1.2deg); }
    38%  { transform:translateX(33px) scale(1.43) rotate(-.8deg); }
    52%  { transform:translateX(36px) scale(1.46) rotate(.6deg); }
    72%  { transform:translateX(34px) scale(1.40) rotate(0); }
    100% { transform:translateX(25px) scale(1.14); opacity:1; }
}
@keyframes skillStageShake{
    0%,8%,100% { transform:translate3d(0,0,0); }
    14% { transform:translate3d(-2px,1px,0); }
    18% { transform:translate3d(3px,-1px,0); }
    22% { transform:translate3d(-2px,-1px,0); }
    27% { transform:translate3d(2px,1px,0); }
    34% { transform:translate3d(-1px,0,0); }
    42% { transform:translate3d(1px,0,0); }
}
@keyframes skillScreenPulse{
    0%{opacity:0}
    8%{opacity:1}
    24%{opacity:.72}
    65%{opacity:.48}
    100%{opacity:0}
}
/* 미니 전투에서는 화면이 작으므로 확대량만 살짝 절제 */
#app.mini-mode.mini-battle-mode #battle-stage.skill-cutscene .hero.skill{
    animation:skillHeroCutsceneMini 1.35s cubic-bezier(.18,.78,.23,1) both !important;
}
@keyframes skillHeroCutsceneMini{
    0%   { transform:translateX(8px) scale(1.02); opacity:.6; }
    15%  { transform:translateX(15px) scale(1.20); opacity:1; }
    34%  { transform:translateX(18px) scale(1.27) rotate(1deg); }
    52%  { transform:translateX(16px) scale(1.24) rotate(-.7deg); }
    75%  { transform:translateX(15px) scale(1.19); }
    100% { transform:translateX(8px) scale(1.08); }
}

<style id="mr-startup-logo-size">

<style id="mrfx-styles">

#overlay-gameover .go-panel{width:min(340px,100%);padding:30px 18px 18px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:visible;}
#overlay-gameover.go-play .go-panel{animation:goPanelIn .5s cubic-bezier(.2,1.3,.4,1) both;}
@keyframes goPanelIn{0%{opacity:0;transform:translateY(40px) scale(.86)}100%{opacity:1;transform:none}}
#overlay-gameover .go-burst{position:absolute;left:50%;top:-10px;width:260px;height:260px;margin-left:-130px;margin-top:-90px;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,215,114,.22) 0 10deg,transparent 10deg 30deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);z-index:-1;}

.mr-dialog-box{position:relative;animation:fxPop .26s cubic-bezier(.2,1.3,.4,1);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 24px rgba(124,227,209,.14)!important;}

.mrfx-shake-l{animation:fxShakeL .42s linear;}
@keyframes fxShakeS{0%,100%{translate:0 0}20%{translate:-3px 1px}40%{translate:3px -1px}60%{translate:-2px 1px}80%{translate:2px 0}}
@keyframes fxShakeL{0%,100%{translate:0 0}10%{translate:-7px 3px}25%{translate:6px -3px}40%{translate:-5px 2px}55%{translate:4px -2px}70%{translate:-3px 1px}85%{translate:2px 0}}

/* 친구 방문: STEAM 에디션 표시 */
.visit-char.is-steam{filter:drop-shadow(0 0 6px rgba(108,184,255,.75));}
.visit-chip-steam{position:absolute;left:3px;bottom:3px;padding:1px 4px;border-radius:4px;background:#17324f;color:#8cc8ff;font-size:8px;font-weight:900;letter-spacing:.3px;}
.visit-chip{position:relative;}
.steam-sheet-shade{position:fixed;inset:0;z-index:10040;background:rgba(4,8,14,.6);display:flex;align-items:flex-end;justify-content:center;animation:steamFade .15s ease-out;}
.steam-sheet{width:min(460px,100%);background:#15233a;border-top:2px solid var(--steam);border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;color:#e6eef5;animation:steamUp .22s ease-out;}
.steam-sheet-top{display:flex;gap:14px;align-items:center;}
.steam-sheet-art{width:96px;height:96px;border-radius:14px;background:#0f1824;border:2px solid var(--steam);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.steam-sheet-art img{width:86px;height:86px;object-fit:contain;}
.steam-sheet-grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
.steam-sheet-cell{padding:10px 0;border-radius:12px;background:#0f1824;display:flex;flex-direction:column;align-items:center;gap:2px;}
.steam-sheet-cell span{font-size:12px;font-weight:700;}
.steam-sheet-cell b{font-size:18px;font-weight:900;}
.steam-sheet-cell.is-local{color:var(--local);}
.steam-sheet-cell.is-steam{color:var(--steam-text);border:1px solid var(--steam-line);}
.steam-sheet-cell.is-off b{color:#4f647c;}
.steam-sheet-sum{grid-column:span 2;text-align:center;font-size:14px;font-weight:900;}
.steam-sheet-cat{display:block;width:max-content;margin:0 auto 4px;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;}
.steam-sheet-cat.is-battle_char{background:#17324f;color:#8cc8ff;}
.steam-sheet-cat.is-char{background:#3a2a52;color:#e2c6ff;}
html body #app #steam-shop .steam-cat-head{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:4px 0 0;font-size:11px;font-weight:900;letter-spacing:.2px;}
html body #app #steam-shop .steam-cat-head::after{content:'';flex:1;height:1px;background:currentColor;opacity:.25;}
html body #app #steam-shop .steam-cat-head.is-battle_char{color:#8cc8ff;}
html body #app #steam-shop .steam-cat-head.is-char{color:#e2c6ff;}
.steam-sheet-sum [data-tier="R"]{color:#b69afa}.steam-sheet-sum [data-tier="E"]{color:#ffd772}.steam-sheet-sum [data-tier="L"]{color:#ff9ad5}
.steam-sheet-warn{margin:0;padding:10px 14px;border-radius:12px;background:#2b1d22;color:#ffc7cf;font-size:13px;line-height:1.6;}
.steam-sheet-warn span{display:block;}.steam-sheet-warn b{font-weight:900;}
.steam-sheet-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.steam-sheet-actions button{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font:inherit;font-size:15px;font-weight:900;cursor:pointer;}
.steam-sheet-actions .ui-icon{width:18px;height:18px;}
.steam-sheet-actions .primary{border:0;background:var(--steam);color:#0b1f33;}
.steam-sheet-actions .ghost{border:1px solid var(--steam-line);background:transparent;color:var(--steam-text);}
.steam-sheet-actions button:disabled{opacity:.4;cursor:default;}
.steam-sheet-actions button:focus-visible{outline:2px solid #fff;outline-offset:2px;}
@keyframes steamUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.steam-sheet-shade,.steam-sheet{animation:none}}
</style>
<style id="mr-social-ui-style">
/* 소셜 탭은 관전·방문 패널 + ROOM 화면을 한 번에 위아래로 스크롤 (아래 내용이 잘리지 않게) */
#app #view-social{overflow-y:auto!important;overflow-x:hidden;overscroll-behavior:contain;}
#app #view-social>#social-visit,#app #view-social>#social-spectate{flex:0 0 auto;}
#app #view-social>#social-root{flex:0 0 auto!important;overflow:visible!important;min-height:auto!important;padding:12px 12px 24px!important;}
#social-root{padding:12px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;}
#social-root .social-card{background:var(--t-surface,#18263a);border:1px solid var(--t-line,#2f4560);border-radius:14px;padding:14px;}
#social-root .social-hero{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:22px 16px;}
#social-root .social-hero-icon{font-size:32px;color:var(--t-accent,#7ce3d1);display:flex;justify-content:center;}
#social-root .social-hero-icon svg{width:36px;height:36px;}
#social-root .social-title{font-size:16px;font-weight:900;color:var(--t-text,#e6eef5);}
#social-root .social-desc{font-size:11.5px;color:var(--t-sub,#9fb1c4);line-height:1.45;}
#social-root .social-btn{border:1px solid var(--t-line,#2f4560);background:transparent;color:var(--t-text,#e6eef5);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;}
#social-root .social-btn.primary{background:var(--t-accent,#7ce3d1);border-color:var(--t-accent,#7ce3d1);color:var(--t-accent-ink,#0f2a33);padding:12px;font-size:13px;}
#social-root .social-btn.danger{color:var(--t-danger,#ef7d8c);border-color:rgba(239,125,140,.5);}
#social-root .social-link{background:none;border:0;padding:2px;color:var(--t-sub,#9fb1c4);font-size:11px;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:inherit;align-self:center;}
#social-root .social-link:disabled{opacity:.45;cursor:default;}
#social-root .social-host-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--t-line,#2f4560);}
#social-root .social-host-row .social-note{flex:1;min-width:0;}
#social-root .social-badge.lock{color:var(--t-gold,#e8c96b);border-color:rgba(232,201,107,.5);margin-left:4px;}
#social-root .social-btn.on{border-color:var(--t-accent,#7ce3d1);color:var(--t-accent,#7ce3d1);}
#social-root .social-btn.small{padding:6px 9px;font-size:10.5px;border-radius:8px;}
#social-root .social-btn.ghost{border-style:dashed;color:var(--t-sub,#9fb1c4);}
#social-root .social-btn.wide{width:100%;}
#social-root .social-btn:disabled{opacity:.45;cursor:default;}
#social-root .social-join-row{display:flex;gap:8px;}
#social-root .social-input{flex:1;min-width:0;background:var(--t-bg,#0f1824);border:1px solid var(--t-line,#2f4560);border-radius:10px;color:var(--t-text,#e6eef5);padding:10px 12px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-family:inherit;}
#social-root .social-input::placeholder{letter-spacing:0;text-transform:none;color:var(--t-mute,#71859b);font-weight:600;}
#social-root .social-note,#social-root .social-me{font-size:10.5px;color:var(--t-mute,#71859b);line-height:1.4;}
#social-root .social-me b{color:var(--t-sub,#9fb1c4);}
#social-root .social-msg{font-size:11.5px;font-weight:800;color:var(--t-danger,#ef7d8c);text-align:center;}
#social-root .social-room-head{display:flex;align-items:center;gap:10px;}
#social-root .social-label{font-size:10px;color:var(--t-mute,#71859b);font-weight:800;}
#social-root .social-code{font-size:20px;font-weight:1000;letter-spacing:3px;color:var(--t-accent,#7ce3d1);font-variant-numeric:tabular-nums;}
#social-root .social-count{margin-left:auto;text-align:right;}
#social-root .social-count-num{font-size:18px;font-weight:1000;color:var(--t-text,#e6eef5);font-variant-numeric:tabular-nums;}
#social-root .social-slots{display:flex;flex-direction:column;gap:8px;}
#social-root .social-slot{display:grid;grid-template-columns:40px 1fr;gap:6px 10px;align-items:center;background:var(--t-surface,#18263a);border:1px solid var(--t-line,#2f4560);border-radius:12px;padding:10px 12px;}
#social-root .social-slot.is-self{border-color:var(--t-accent,#7ce3d1);}
#social-root .social-slot.empty{border-style:dashed;background:transparent;}
#social-root .social-avatar{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--t-bg,#0f1824);border:1px solid var(--t-line,#2f4560);display:flex;align-items:center;justify-content:center;font-weight:1000;color:var(--t-sub,#9fb1c4);font-size:15px;}
#social-root .social-slot.is-host .social-avatar{color:var(--t-gold,#e8c96b);border-color:var(--t-gold,#e8c96b);}
#social-root .social-slot-top{display:flex;align-items:center;gap:6px;min-width:0;}
#social-root .social-name{font-size:13px;font-weight:900;color:var(--t-text,#e6eef5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#social-root .social-name.muted{color:var(--t-mute,#71859b);font-weight:700;}
#social-root .social-badge{flex:0 0 auto;font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--t-bg,#0f1824);color:var(--t-sub,#9fb1c4);border:1px solid var(--t-line,#2f4560);}
#social-root .social-badge.host{color:var(--t-gold,#e8c96b);border-color:rgba(232,201,107,.5);}
#social-root .social-badge.you{color:var(--t-accent,#7ce3d1);border-color:rgba(124,227,209,.5);}
#social-root .social-slot-actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
#social-root .social-slot-actions:empty{display:none;}
#social-root .social-slot:has(.social-slot-actions:empty) .social-avatar{grid-row:auto;}
#social-root .social-soon{font-size:9.5px;color:var(--t-mute,#71859b);}
#social-root .social-spinner{width:28px;height:28px;border:3px solid var(--t-line,#2f4560);border-top-color:var(--t-accent,#7ce3d1);border-radius:50%;margin:0 auto;animation:social-spin .9s linear infinite;}
@keyframes social-spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){#social-root .social-spinner{animation:none;}}
</style>
<style id="mr-social-spectate-style">
#social-spectate{padding:12px 12px 0;box-sizing:border-box;}
#social-spectate:empty{display:none;}
#social-spectate .spec-panel{background:var(--t-surface,#18263a);border:1px solid var(--t-accent,#7ce3d1);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;}
#social-spectate .spec-head{display:flex;align-items:center;gap:7px;min-width:0;}
#social-spectate .spec-live{flex:0 0 auto;font-size:9.5px;font-weight:1000;color:#ff6b7d;letter-spacing:.5px;}
#social-spectate .spec-label{flex:0 0 auto;font-size:10.5px;color:var(--t-mute,#71859b);font-weight:800;}
#social-spectate .spec-name{font-size:12.5px;font-weight:900;color:var(--t-text,#e6eef5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#social-spectate .spec-close,#social-spectate .spec-pop{margin-left:auto;flex:0 0 auto;border:1px solid var(--t-line,#2f4560);background:transparent;color:var(--t-text,#e6eef5);border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:900;cursor:pointer;font-family:inherit;}
#social-spectate .spec-pop{margin-left:0;}
#social-spectate .spec-stage{position:relative;height:150px;}
#social-spectate .spec-note{font-size:10px;color:var(--t-mute,#71859b);}
#social-spectate .spec-note:empty{display:none;}
</style>
<style id="mr-social-visit-style">
#social-visit{padding:12px 12px 0;box-sizing:border-box;}
#social-visit:empty{display:none;}
#social-visit .visit-panel{background:var(--t-surface,#18263a);border:1px solid var(--t-gold,#e8c96b);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;}
#social-visit .visit-head{display:flex;align-items:center;gap:7px;min-width:0;}
#social-visit .visit-tag{flex:0 0 auto;font-size:9.5px;font-weight:1000;color:var(--t-gold,#e8c96b);border:1px solid rgba(232,201,107,.5);border-radius:999px;padding:2px 7px;}
#social-visit .visit-label{flex:0 0 auto;font-size:10.5px;color:var(--t-mute,#71859b);font-weight:800;}
#social-visit .visit-name{font-size:12.5px;font-weight:900;color:var(--t-text,#e6eef5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#social-visit .visit-close{margin-left:auto;flex:0 0 auto;border:1px solid var(--t-line,#2f4560);background:transparent;color:var(--t-text,#e6eef5);border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:900;cursor:pointer;font-family:inherit;}
#social-visit .visit-room{position:relative;width:100%;aspect-ratio:2/3;max-height:62vh;border-radius:10px;overflow:hidden;background:#1d2a3c;container-type:inline-size;isolation:isolate;}
#social-visit .visit-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;user-select:none;pointer-events:none;transform-origin:center center;}
#social-visit .visit-char{position:absolute;width:44%;height:58%;object-fit:contain;z-index:2;cursor:pointer;user-select:none;-webkit-user-drag:none;transition:filter .15s;}
#social-visit .visit-char.love{animation:visit-love .6s cubic-bezier(.22,.85,.32,1);}
@keyframes visit-love{40%{translate:0 -3%;filter:drop-shadow(0 0 10px rgba(255,120,170,.8));}}
#social-visit .visit-emoji{position:absolute;z-index:1;line-height:1;font-size:clamp(14px,7cqw,42px);user-select:none;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));transform-origin:center center;}
#social-visit .visit-emoji img{width:1em;height:1em;display:block;}
#social-visit .visit-heart{position:absolute;z-index:8;pointer-events:none;font-size:16px;transform:translate(-50%,-50%) scale(.7);animation:visit-heart .95s ease-out forwards;}
@keyframes visit-heart{0%{opacity:0;transform:translate(-50%,-35%) scale(.55);}18%{opacity:1;}100%{opacity:0;transform:translate(calc(-50% + var(--hx)),calc(-50% - 62px)) scale(1.2) rotate(var(--hr));}}
#social-visit .visit-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;background:rgba(15,24,36,.72);color:var(--t-sub,#9fb1c4);font-size:11.5px;font-weight:800;z-index:9;}
#social-visit .visit-overlay[hidden]{display:none;}
#social-visit .visit-items-title{font-size:10.5px;font-weight:800;color:var(--t-mute,#71859b);margin-bottom:6px;}
#social-visit .visit-items-title b{color:var(--t-sub,#9fb1c4);}
#social-visit .visit-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
#social-visit .visit-chip{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:10px;border:1px solid var(--t-line,#2f4560);background:var(--t-bg,#0f1824);padding:3px;cursor:pointer;overflow:hidden;}
#social-visit .visit-chip:hover,#social-visit .visit-chip:focus-visible{border-color:var(--t-accent,#7ce3d1);}
#social-visit .visit-chip-img{width:100%;height:100%;object-fit:contain;display:block;}
#social-visit .visit-chip-img.bg{object-fit:cover;border-radius:7px;}
#social-visit .visit-chip-img.as-text{display:flex;align-items:center;justify-content:center;font-size:24px;}
#social-visit .visit-chip-tier,.visit-detail .visit-chip-tier{position:absolute;left:3px;top:3px;font-size:8px;font-weight:1000;padding:1px 4px;border-radius:5px;background:rgba(0,0,0,.65);color:#fff;line-height:1.2;}
#social-visit .visit-chip.unowned{border-style:dashed;}
#social-visit .visit-chip-new{position:absolute;right:3px;bottom:3px;width:13px;height:13px;border-radius:50%;background:var(--t-gold,#e8c96b);color:#1a1a1a;font-size:9px;font-weight:1000;display:flex;align-items:center;justify-content:center;}
.visit-detail{position:fixed;inset:0;z-index:20000;background:rgba(5,10,18,.6);display:flex;align-items:center;justify-content:center;padding:16px;}
.visit-detail-card{width:min(320px,100%);background:var(--t-surface,#18263a);border:1px solid var(--t-line,#2f4560);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--t-text,#e6eef5);box-shadow:0 12px 40px rgba(0,0,0,.45);}
.visit-detail-visual{height:170px;border-radius:12px;background:var(--t-bg,#0f1824);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.visit-detail-img{max-width:100%;max-height:100%;object-fit:contain;}
.visit-detail-visual.bg .visit-detail-img{width:100%;height:100%;object-fit:cover;}
.visit-detail-img.as-text{font-size:72px;line-height:1;}
.visit-detail-top{display:flex;align-items:center;gap:6px;}
.visit-detail .visit-detail-top .visit-chip-tier{position:static;font-size:10px;padding:2px 7px;}
.visit-detail-cat{font-size:10.5px;font-weight:800;color:var(--t-mute,#71859b);}
.visit-detail-name{font-size:16px;font-weight:1000;}
.visit-detail-title{font-size:11px;color:var(--t-sub,#9fb1c4);margin-top:-4px;}
.visit-detail-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--t-sub,#9fb1c4);padding:6px 0;border-top:1px solid var(--t-line,#2f4560);}
.visit-detail-row b.ok{color:var(--t-accent,#7ce3d1);}
.visit-detail-row b.no{color:var(--t-gold,#e8c96b);}
.visit-routes{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.visit-route{font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;border:1px solid var(--t-line,#2f4560);color:var(--t-text,#e6eef5);}
.visit-detail-actions{display:flex;gap:8px;margin-top:4px;}
.visit-detail-btn{flex:1;border:1px solid var(--t-line,#2f4560);background:transparent;color:var(--t-text,#e6eef5);border-radius:10px;padding:10px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;}
.visit-detail-btn.primary{background:var(--t-accent,#7ce3d1);border-color:var(--t-accent,#7ce3d1);color:var(--t-accent-ink,#0f2a33);}
html body #app #item-collection-grid .inv-item.codex-focus{outline:3px solid var(--t-accent,#7ce3d1)!important;outline-offset:1px!important;box-shadow:0 0 0 3px var(--t-accent,#7ce3d1),0 0 16px rgba(124,227,209,.7)!important;opacity:1!important;filter:none!important;animation:codex-focus-pulse .8s ease-in-out 3;z-index:2;}
@keyframes codex-focus-pulse{50%{outline-color:transparent;}}
#social-visit .visit-note{font-size:10px;color:var(--t-mute,#71859b);}
#social-visit .visit-note:empty{display:none;}
@media (prefers-reduced-motion:reduce){#social-visit .visit-char.love,#social-visit .visit-heart{animation:none;opacity:0;}}
</style>
<style id="mr-social-emote-style">
.mr-emote-btn{flex:0 0 auto;border:1px solid var(--t-line,#2f4560);background:transparent;color:var(--t-text,#e6eef5);border-radius:8px;padding:5px 9px;font-size:10.5px;font-weight:900;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
.mr-emote-btn.open{border-color:var(--t-accent,#7ce3d1);color:var(--t-accent,#7ce3d1);}
.mr-emote-btn:disabled{opacity:.5;cursor:default;}
.mr-emote-picker{background:var(--t-bg,#0f1824);border:1px solid var(--t-line,#2f4560);border-radius:10px;padding:8px;}
.mr-emote-picker-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800;color:var(--t-mute,#71859b);margin-bottom:6px;}
.mr-emote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;max-height:132px;overflow-y:auto;}
.mr-emote-pick{height:38px;border-radius:8px;border:1px solid transparent;background:var(--t-surface,#18263a);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;padding:4px;}
.mr-emote-pick:hover,.mr-emote-pick:focus-visible{border-color:var(--t-accent,#7ce3d1);}
.mr-emote-pick:disabled{opacity:.4;cursor:default;}
.mr-emote-pick img{width:30px;height:30px;display:block;object-fit:contain;}
.mr-emote-empty{font-size:11px;color:var(--t-sub,#9fb1c4);text-align:center;padding:10px 4px;line-height:1.45;}
.mr-emote-pop{position:absolute;z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-50%);animation:mr-emote-rise 1.8s ease-out forwards;}
.mr-emote-pop .mr-emote-face{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));}

<style id="mr-battle-sky">
/* 2026-10-14 전투 배경 레이어 (시안 C: 실루엣 하늘)
   뒤 → 앞: 하늘색(코드) · 해/달/포털(고정) · 먼 실루엣 + 랜드마크 풍차(땅의 15% 속도) · 땅
   - 하늘 단계 5개(새벽·낮·노을·밤·포털): 보스를 잡을 때마다 다음 단계, 1.8초에 걸쳐 색·해·달이 바뀜
   - 해와 달은 아주 멀어서 제자리 (기차 창밖처럼). 포털은 제자리에서 천천히 회전, 풍차 날개는 계속 회전
   - 실루엣·풍차는 세계별(1~10 러스트 · 11~20 네온 · 21~30 스카이아크). 실루엣 모양은 그림, 색은 하늘 단계에 맞춰 코드가 칠함
   - 연쇄 가속은 먼 풍경에 30%만 반영 (멀미 방지) */
#battle-sky{position:absolute;inset:0;z-index:-3;overflow:hidden;pointer-events:none;background:#6fa7dc;transition:filter .1s}
#battle-sky>div{position:absolute;inset:0}
.sky-grad i{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease}
.sky-grad i:nth-child(1){background:linear-gradient(#4b5b8c,#a993b5 26%,#f1c39e 48%)}
.sky-grad i:nth-child(2){background:linear-gradient(#5fa9dc,#a9d6ec 26%,#efe6cc 48%)}
.sky-grad i:nth-child(3){background:linear-gradient(#56396b,#cf6f58 26%,#f5b462 48%)}
.sky-grad i:nth-child(4){background:linear-gradient(#141c3a,#26345e 26%,#3f5582 48%)}
.sky-grad i:nth-child(5){background:linear-gradient(#35296a,#6f53aa 26%,#bda2e4 48%)}
#battle-stage[data-sky="0"] .sky-grad i:nth-child(1),#battle-stage[data-sky="1"] .sky-grad i:nth-child(2),#battle-stage[data-sky="2"] .sky-grad i:nth-child(3),#battle-stage[data-sky="3"] .sky-grad i:nth-child(4),#battle-stage[data-sky="4"] .sky-grad i:nth-child(5){opacity:1}
.sky-stars{opacity:0;transition:opacity 1.8s;background:
  radial-gradient(1.4px 1.4px at 8% 12%,#fff6d0 99%,transparent),radial-gradient(1.2px 1.2px at 19% 30%,#fff6d0 99%,transparent),radial-gradient(1.6px 1.6px at 31% 8%,#fff6d0 99%,transparent),
  radial-gradient(1.1px 1.1px at 44% 24%,#fff6d0 99%,transparent),radial-gradient(1.5px 1.5px at 55% 6%,#fff6d0 99%,transparent),radial-gradient(1.2px 1.2px at 63% 28%,#fff6d0 99%,transparent),
  radial-gradient(1.4px 1.4px at 88% 14%,#fff6d0 99%,transparent),radial-gradient(1.1px 1.1px at 95% 32%,#fff6d0 99%,transparent),radial-gradient(1.3px 1.3px at 38% 34%,#fff6d0 99%,transparent)}
#battle-stage[data-sky="3"] .sky-stars{opacity:.9}
#battle-stage[data-sky="0"] .sky-stars{opacity:.35}
/* 해·달·포털: 고정 위치. 해는 단계마다 자리를 옮기며(1.8초) 떠오르고 지는 느낌 */
.sky-cel i{position:absolute;aspect-ratio:1;background:center/contain no-repeat;opacity:0;transition:opacity 1.8s ease,left 1.8s ease,top 1.8s ease,height 1.8s ease,filter 1.8s ease}
.sky-cel .cel-sun{background-image:url('assets/art/backgrounds/sky/cel_sun.png');left:24%;top:13%;height:22%}
.sky-cel .cel-moon{background-image:url('assets/art/backgrounds/sky/cel_moon.png');left:76%;top:7%;height:22%}
.sky-cel .cel-portal{background-image:url('assets/art/backgrounds/sky/cel_portal.png');left:46%;top:4%;height:30%;animation:mrSkySpin 14s linear infinite}
#battle-stage[data-sky="0"] .cel-sun{opacity:1;filter:saturate(.75) brightness(1.08)}
#battle-stage[data-sky="1"] .cel-sun{opacity:1;left:76%;top:6%;height:22%}
#battle-stage[data-sky="2"] .cel-sun{opacity:1;left:62%;top:10%;height:26%;filter:hue-rotate(-18deg) saturate(1.25)}
#battle-stage[data-sky="3"] .cel-moon,#battle-stage[data-sky="4"] .cel-portal{opacity:1}
@keyframes mrSkySpin{to{transform:rotate(360deg)}}
/* 먼 실루엣 + 랜드마크 풍차: 타일 반복(풍차는 두 칸에 하나), 땅과 같은 방식으로 흐름 */
#battle-sky .sky-far{inset:0 auto auto 0;height:60%;width:calc(100% + 2 * var(--mr-far-w,350px));display:flex;animation:mrFarTravel var(--mr-far-dur,160s) linear infinite;will-change:transform}
@keyframes mrFarTravel{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-2 * var(--mr-far-w,350px)),0,0)}}
.far-tile{position:relative;flex:0 0 var(--mr-far-w,350px);height:100%}
.far-sil{position:absolute;inset:0;background-color:var(--mr-far-c,#a9bccb);-webkit-mask:var(--mr-far-img) 0 0/100% 100% no-repeat;mask:var(--mr-far-img) 0 0/100% 100% no-repeat;transition:background-color 1.8s ease}
.far-mill{position:absolute;left:56%;bottom:0;height:64%;aspect-ratio:1/2;filter:var(--mr-mill-tint,none);transition:filter 1.8s ease}
.far-tile:nth-child(even) .far-mill{display:none}
.mill-tower{position:absolute;inset:0;background:var(--mr-mill-tower) center bottom/contain no-repeat}
.mill-blades{position:absolute;left:50%;top:calc(var(--mr-mill-hub,.22) * 100%);width:160%;aspect-ratio:1;background:var(--mr-mill-blades) center/contain no-repeat;animation:mrMillSpin 7s linear infinite}

/* 하늘 단계별: 먼 실루엣 색 · 풍차 색조 · 땅 색조 (그림은 낮 조명 기준) */
#battle-stage[data-sky="0"]{--mr-far-c:#a17d92;--mr-mill-tint:brightness(.82) saturate(.7) hue-rotate(-6deg);--mr-ground-tint:brightness(.86) saturate(.8) hue-rotate(-6deg)}
#battle-stage[data-sky="1"]{--mr-far-c:#8ea4b8;--mr-mill-tint:saturate(.85) brightness(1.02);--mr-ground-tint:none}
#battle-stage[data-sky="2"]{--mr-far-c:#9c5550;--mr-mill-tint:sepia(.25) saturate(1.05) brightness(.85) hue-rotate(-10deg);--mr-ground-tint:sepia(.18) saturate(1.12) brightness(.9) hue-rotate(-10deg)}
#battle-stage[data-sky="3"]{--mr-far-c:#22304f;--mr-mill-tint:brightness(.45) saturate(.6);--mr-ground-tint:brightness(.55) saturate(.7) contrast(1.05)}
#battle-stage[data-sky="4"]{--mr-far-c:#7660a8;--mr-mill-tint:brightness(.78) saturate(.75) hue-rotate(-18deg);--mr-ground-tint:brightness(.82) saturate(.85) hue-rotate(-18deg)}
#battle-panorama{width:calc(100% + 2 * var(--mr-ground-w,290px))!important;animation-name:mrGroundTravel!important;animation-duration:var(--mr-ground-dur,24s)!important}

@keyframes mrGroundTravel{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-2 * var(--mr-ground-w,290px)),0,0)}}

/* 2026-10-16: 보스 처치 바람이 하늘을 쓸고 지나감 (MRBattleSky.windSweep) — 세계관 색 띠 + 바람 줄기, 그동안 하늘 전환을 빠르게 */
#battle-stage.mr-sky-gust #battle-sky .sky-grad i,#battle-stage.mr-sky-gust #battle-sky .sky-stars,#battle-stage.mr-sky-gust #battle-sky [class^="cel-"]{transition-duration:.9s!important}

 background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--g2) 55%,transparent) 35%,color-mix(in srgb,var(--g1) 70%,rgba(255,255,255,.7)) 62%,transparent);filter:blur(6px);animation:mrSkyBand 1.35s cubic-bezier(.35,.05,.25,1) forwards}

<script id="mrstage-fit">
function lmPortraitK(){try{const w=window.top||window;return w.matchMedia('(orientation:portrait)').matches&&w.innerWidth<820?0.7:1;}catch(e){return 1;}}

/* 원본 전투 칸 높이(145px, 메인 화면) 그대로 배치하고 통째로 확대 — 캐릭터·빌런·글자·이펙트 비율이 M&R과 같다.
   캔버스(리그·이펙트)가 흐려지지 않게 확대 배율만큼 devicePixelRatio 를 올려 알려 준다 */
(function(){
  var DH=145,real=window.devicePixelRatio||1,k=1,app=document.getElementById('app');
  try{Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:function(){return real*k;}});}catch(e){}
  function fit(){
    var W=window.innerWidth||1,H=window.innerHeight||1;k=H/DH;
    app.style.setProperty('width',(W/k)+'px','important');app.style.setProperty('height',DH+'px','important');
    app.style.setProperty('transform','scale('+k+')','important');
    document.documentElement.style.setProperty('--mrstage-k',k);window.MRStageK=k;
  }
  fit();window.addEventListener('resize',fit);window.MRStageFit=fit;
  window.handleAssetImageLoad=window.handleAssetImageLoad||function(){};window.handleAssetImageError=window.handleAssetImageError||function(){};
})();
</script>

 };

window.MRRoomFit=(()=>{

 const TOP={1:0.2,2:0.18,3:0.3,4:0.15,5:0.17,6:0.29,7:0.256,8:0.28,9:0.3,10:0.32,11:0.15,12:0.23,13:0.31,14:0.164,15:0.19,16:0.29,17:0.352,18:0.221,19:0.294,20:0.307,21:0.15,22:0.2,23:0.33,24:0.178,25:0.1,26:0.29,27:0.27,28:0.24,29:0.22,30:0.305};

 const TARGET=0.72, BASE_FOOT=0.92, MIN=0.8, MAX=1.25; // TARGET = 30종 키의 중간값
 // 2026-10-13 마이룸 캐릭터 전체 크기: 기존의 70% (멈춤·달리기·친구 방문·말풍선 위치 모두 이 값을 따라감, 발끝 높이는 그대로)
 const SIZE=0.7;
 const numOf=v=>{const m=String(v??'').match(/char_(\d{4})/);return m?Number(m[1]):Number(v)||0;};
 function factor(num){const t=TOP[num],ft=FOOT[num];if(t==null||!ft)return SIZE;const m=ft-t;return SIZE*(m>0?Math.max(MIN,Math.min(MAX,TARGET/m)):1);}
 // el: 그림 박스(object-fit:contain, 정사각형 그림), scale/rotate/flip: 사용자 조정값

    const N=160,k=N/Math.max(im.naturalWidth,im.naturalHeight),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));

                const actorId=slot!==null?battleTeamElement(slot)?.id||'':'',hitT=window.MRBattleFX?.tuneFor?.('hit',window.MRBattleFX.charNum(actorId))||window.MR_FX_TUNING?.hit||{};
                const rigHit=state==='attack'&&slot!==null&&hitT.syncRig!==false?window.MRRig?.hitDelayMs?.(actorId):null;

const battleVisualQueue=[];
let battleVisualBusy=false;

function finishBattleVisualEvent(delay=0){

            battleVisualBusy=false;
            isBattling=false;
            pumpBattleVisualQueue();

function combineBattleVisual(previous, incoming){
        const result={...incoming};
        result.hitCount=(previous.hitCount||1)+(incoming.hitCount||1);
        result.actionState=previous.actionState==='skill'||incoming.actionState==='skill'?'skill':'attack';
        result.mergeLevel=Math.max(previous.mergeLevel||0,incoming.mergeLevel||0);
        if(incoming.kind==='boss'){
            result.damage=(previous.damage||0)+(incoming.damage||0);
            result.killed=!!(previous.killed||incoming.killed);
            result.reward=(previous.reward||0)+(incoming.reward||0);
        }else{
            // Retain a defeated enemy for the combined defeat presentation.
            if(previous.killed && !incoming.killed){
                result.enemyId=previous.enemyId;result.hpAfter=previous.hpAfter;result.maxHp=previous.maxHp;
            }
            result.killed=!!(previous.killed||incoming.killed);

        if(battleHeroState==='skill') event.actionState='attack';
        const last=battleVisualQueue[battleVisualQueue.length-1];
        const compatible=last && last.kind===event.kind &&

        if(runFinished || isGameOver || battleVisualBusy || globalPause || !battleVisualQueue.length) return;

        // 보스가 화면에 고정된 동안에는 일반 몬스터 연출이 앞에 끼어들 수 없습니다.

                showFloatingText(`BOSS -${event.damage} HP${event.multiplier>1?` (x${event.multiplier})`:''}`,245,105,'#ff7675');

                    window.MRFX?.bossDown(!!gameSettings.screenShake);
                    if(document.getElementById('app')?.classList.contains('mini-mode')) showFloatingText('🏆 BOSS DOWN!',210,105,'#ffeaa7');
                    else showFloatingText(`🏆 BOSS DOWN! +${event.reward.toLocaleString(typeof gameLocale==="function"?gameLocale():undefined)} 🪙${event.multiplier>1?` x${event.multiplier}`:''}`,210,105,'#ffeaa7');
                    playSfx('bossClear');
                    playSfx('gold',{gain:1.15});

                    if(enemy){

                }

        }

        // 일반 적 연출. Gold 계산은 이미 즉시 끝났고 여기서는 화면 표현만 담당합니다.
        // 보스 고정 상태라면 일반 적은 화면에 절대 표시하지 않고 처치 연출 종료 뒤로 미룹니다.
        if(bossVisualLock){
            battleVisualQueue.unshift(event);
            battleVisualBusy=false;
            isBattling=false;
            return;
        }

        MR.setEnemy(event.enemyId);
        enemyEl.className='character enemy slide-in';
        updateNormalEnemyHud(event.hpAfter,event.maxHp,true);

        {
            playAttackSequence(1, null, ()=>{
                // 이 일반 전투 도중 보스가 출현했다면 기존 일반 적 연출이 보스를 덮지 않도록 즉시 종료
                if(bossVisualLock){
                    if(enemyEl){
                        MR.setEnemy('boss');
                        enemyEl.className='character enemy slide-in boss-enemy';
                    }
                    updateNormalEnemyHud(0,NORMAL_ENEMY_MAX_HP,false);
                    finishBattleVisualEvent(0);
                    return;
                }

                if(event.killed){
                    window.MRFX?.killFinish(enemyEl,event.mergeLevel||0,!!gameSettings.screenShake);
                    enemyEl.className='character enemy explode';
                    const sign=event.delta>=0?'+':'';
                    const isMiniPlay=document.getElementById('app')?.classList.contains('mini-mode');
                    if(event.delta>0) flyCurrencyReward('gold', event.delta, enemyEl);
                    if(!isMiniPlay) showFloatingText(`${sign}${event.delta.toLocaleString(typeof gameLocale==="function"?gameLocale():undefined)} 🪙${event.multiplier>1?` (x${event.multiplier})`:''}`,235,80,event.delta>=0?'#f6e58d':'#ff7675');
                    if(event.delta>0) playSfx('gold');
                    if(event.victory) playVictoryPose('normal');
                }else{
                    enemyEl.className='character enemy slide-in';
                }

                scheduleBattleVisual(()=>{
                    if(bossVisualLock){
                        MR.setEnemy('boss');
                        enemyEl.className='character enemy slide-in boss-enemy';
                        updateNormalEnemyHud(0,NORMAL_ENEMY_MAX_HP,false);
                    }else if(event.killed){
                        enemyEl.className='character enemy';
                        updateNormalEnemyHud(0,NORMAL_ENEMY_MAX_HP,false);
                    }else{
                        enemyEl.className='character enemy slide-in';
                    }
                    finishBattleVisualEvent(0);
                },event.killed ? (event.victory?650:160) : 0);
            },event.actionState);
        }
    }
let isGameOver = false;
</script>

<script id="mrfx-runtime">
